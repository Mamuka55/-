<!DOCTYPE html>
<html lang="ru" data-blur="true" data-animations="true" data-lowperf="false">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Epic AI — демо административной панели</title>
<!-- Демо-страница Epic AI: mock-backend встроен, сеть не требуется -->
<style>
/* ============================================================
   EPIC AI — дизайн-токены 
   Единственный источник цветов. Значения синхронизированы с
   shared/tokens.js, который используют backend и Electron.
   ============================================================ */

:root {
  /* Accent */
  --accent:        #ACE72E;   /* активные элементы, выбранные состояния, CTA, успех, подсветка найденного */
  --accent-bright: #E2FF3F;   /* hover, focus, яркая подсветка */
  --accent-mid:    #72CE1C;   /* иконки, вторичные акценты, маркеры */

  /* Backgrounds */
  --bg-base:    #0C0C0C;      /* самый тёмный фон */
  --bg-dark:    #121416;      /* основная панель, карточки, шапки */
  --bg-surface: #1A1A1A;      /* поля ввода, поверхности */
  --bg-muted:   #2A2A2A;      /* вторичные поверхности */

  /* Text */
  --text-primary: #EEF9F4;
  --text-muted:   #888888;
  --text-subtle:  #666666;

  /* States */
  --danger:  #E74C3C;         /* ошибки и удалённый текст в diff */
  --warning: #F87171;         /* предупреждения, «есть обновления» */
  --info:    #3498DB;

  /* Роли  */
  --role-player:       #888888;
  --role-helper:       #72CE1C;
  --role-admin:        #3498DB;
  --role-senior-admin: #9B59B6;
  --role-deputy-chief: #E67E22;
  --role-chief-admin:  #E74C3C;
  --role-project-lead: #F1C40F;
  --role-developer:    #E2FF3F;

  /* Прозрачность главной панели  */
  --panel-alpha: 0.82;
  --surface-alpha: 0.78;
  --muted-alpha: 0.72;
  --base-alpha: 0.90;
  --drop-alpha: 0.96;

  --glass-panel:   rgba(18, 20, 22, var(--panel-alpha));
  --glass-surface: rgba(26, 26, 26, var(--surface-alpha));
  --glass-muted:   rgba(42, 42, 42, var(--muted-alpha));
  --glass-base:    rgba(12, 12, 12, var(--base-alpha));

  --stroke:        rgba(238, 249, 244, 0.08);
  --stroke-strong: rgba(238, 249, 244, 0.14);
  --stroke-accent: rgba(172, 231, 46, 0.35);

  --radius: 12px;
  --radius-sm: 8px;
  --radius-xs: 6px;

  /* Длительности переходов фиксированные: отдельной настройки анимаций нет */
  --t-fast: 120ms;
  --t-base: 180ms;
  --t-slow: 280ms;
  --ease: cubic-bezier(.22,.61,.36,1);

  --font: "Segoe UI", "Inter", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Cascadia Mono", "JetBrains Mono", Consolas, "Courier New", monospace;
}

/* Blur отключаем одной переменной — настройка «blur»  */
html[data-lowperf="true"] { --t-fast: 0ms; --t-base: 0ms; --t-slow: 0ms; }


/* ============================================================
   EPIC AI — базовые стили (общие для всех окон)
   : тёмное, полупрозрачное, компактное, мягкий blur,
   минимум визуального шума, работа поверх игры.
   ============================================================ */

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: transparent;          /* прозрачное окно Electron */
  color: var(--text-primary);
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.45;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body { user-select: none; }

/* Выделение текста разрешаем только в содержательных областях */
.selectable, .answer-text, .source-text, .diff-view, pre, code, input, textarea {
  user-select: text;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(238, 249, 244, 0.12);
  border-radius: 8px;
}
::-webkit-scrollbar-thumb:hover { background: rgba(172, 231, 46, 0.35); }

a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-bright); }

button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }

/* ---------- Утилиты ---------- */

.glass {
  background: var(--glass-panel);
  border: 1px solid var(--stroke);
}

.muted { color: var(--text-muted); }
.subtle { color: var(--text-subtle); }
.accent { color: var(--accent); }
.danger { color: var(--danger); }
.warning { color: var(--warning); }
.mono { font-family: var(--font-mono); }

.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.gap-4 { gap: 4px; } .gap-6 { gap: 6px; } .gap-8 { gap: 8px; }
.gap-10 { gap: 10px; } .gap-12 { gap: 12px; } .gap-16 { gap: 16px; }
.grow { flex: 1 1 auto; min-width: 0; }
.nowrap { white-space: nowrap; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.center { display: flex; align-items: center; justify-content: center; }

.divider { height: 1px; background: var(--stroke); flex: none; }
.divider-v { width: 1px; background: var(--stroke); align-self: stretch; flex: none; }

/* ---------- Кнопки ---------- */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px; padding: 0 12px;
  border-radius: var(--radius-xs);
  border: 1px solid var(--stroke);
  background: var(--bg-surface);
  color: var(--text-primary);
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
  white-space: nowrap;
}
.btn:hover { border-color: var(--accent-bright); color: var(--accent-bright); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 1px; }
.btn[disabled] { opacity: .4; pointer-events: none; }

.btn--accent {
  background: var(--accent);
  border-color: var(--accent-bright);
  color: #0C0C0C;
}
.btn--accent:hover { background: var(--accent-bright); border-color: var(--accent-bright); color: #0C0C0C; }

/* П.6: у кнопок ВИДНА обводка — ghost больше не сливается с фоном. */
.btn--ghost { background: rgba(255,255,255,.03); border-color: rgba(255,255,255,.28); color: var(--text-primary); }
.btn--ghost:hover { color: var(--accent-bright); background: rgba(226, 255, 63, 0.06); border-color: var(--accent-bright); }

.btn--danger { border-color: rgba(231, 76, 60, .4); color: var(--danger); }
.btn--danger:hover { background: rgba(231, 76, 60, .14); border-color: var(--danger); color: #fff; }

.btn--sm { height: 24px; padding: 0 8px; font-size: 10px; }
.btn--lg { height: 38px; padding: 0 18px; font-size: 12px; }

.icon-btn {
  width: 30px; height: 30px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--radius-xs);
  color: var(--text-muted);
  transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
}
.icon-btn:hover { color: var(--accent-bright); background: rgba(226, 255, 63, 0.08); }
.icon-btn.is-active { color: var(--accent); }
.icon-btn svg { width: 16px; height: 16px; }

/* ---------- Бейджи / метки ---------- */

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  height: 20px; padding: 0 8px;
  border-radius: 999px;
  border: 1px solid var(--stroke);
  background: var(--glass-surface);
  font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  color: var(--text-muted);
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.badge--accent { color: var(--accent); border-color: var(--stroke-accent); background: rgba(172,231,46,.08); }
.badge--danger { color: var(--danger); border-color: rgba(231,76,60,.35); background: rgba(231,76,60,.10); }
.badge--warning { color: var(--warning); border-color: rgba(248,113,113,.35); background: rgba(248,113,113,.10); }
.badge--mid { color: var(--accent-mid); border-color: rgba(114,206,28,.35); background: rgba(114,206,28,.10); }

.tag {
  display: inline-block; padding: 1px 6px; border-radius: 4px;
  background: rgba(238,249,244,.06); color: var(--text-muted);
  font-size: 10px; letter-spacing: .03em;
}

/* ---------- Заголовки секций ---------- */

.section-title {
  font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
  color: var(--text-subtle);
}

/* ---------- Поля ввода ---------- */

.field {
  height: 30px; padding: 0 10px;
  background: var(--glass-surface);
  border: 1px solid var(--stroke);
  border-radius: var(--radius-xs);
  color: var(--text-primary);
  transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
  width: 100%;
}
.field::placeholder { color: var(--text-subtle); }
.field:hover { border-color: var(--stroke-strong); }
.field:focus { outline: none; border-color: var(--accent); background: rgba(26,26,26,.95); }
.field:focus-visible { box-shadow: 0 0 0 2px rgba(226,255,63,.18); }
textarea.field { height: auto; padding: 8px 10px; resize: vertical; line-height: 1.5; }
select.field { appearance: none; padding-right: 26px; cursor: pointer; }

/* ---------- Переключатель ---------- */

.switch { position: relative; width: 34px; height: 18px; flex: none; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch .track {
  position: absolute; inset: 0; border-radius: 999px;
  background: var(--bg-muted); border: 1px solid var(--stroke);
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
}
.switch .thumb {
  position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--text-muted);
  transition: transform var(--t-base) var(--ease), background var(--t-fast) var(--ease);
}
.switch input:checked ~ .track { background: rgba(172,231,46,.22); border-color: var(--stroke-accent); }
.switch input:checked ~ .thumb { transform: translateX(16px); background: var(--accent); }
.switch input:focus-visible ~ .track { box-shadow: 0 0 0 2px rgba(226,255,63,.25); }

/* ---------- Спиннер ---------- */

.spinner {
  width: 14px; height: 14px; flex: none;
  border: 2px solid rgba(172,231,46,.22);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 700ms linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Пульсация статуса ---------- */

.pulse { animation: pulse 1600ms ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

/* ---------- Скролл-области ---------- */

.scroll { overflow-y: auto; overflow-x: hidden; }
.scroll::-webkit-scrollbar { width: 6px; }

/* ============================================================
   EPIC AI — административная панель 
   Отдельное окно, но в той же дизайн-системе: тёмное, компактное,
   минимум визуального шума.
   ============================================================ */

body.admin { height: 100vh; display: flex; flex-direction: column; background: var(--bg-base); }

.admin__titlebar {
  flex: none; height: 38px;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg-dark);
  border-bottom: 1px solid var(--stroke);
}

.admin__shell { flex: 1 1 auto; min-height: 0; display: flex; }

/* ---------- Сайдбар ---------- */

.admin__sidebar {
  flex: none; width: 232px;
  display: flex; flex-direction: column;
  background: rgba(18,20,22,.72);
  border-right: 1px solid var(--stroke);
}

.admin__user {
  flex: none; padding: 12px;
  border-bottom: 1px solid var(--stroke);
  display: flex; align-items: center; gap: 10px;
}
.admin__user .avatar { width: 34px; height: 34px; }
.admin__user-name { font-size: 12px; font-weight: 700; }

.admin__nav { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 1px; }

.nav-group { margin-top: 6px; }
.nav-group__title {
  padding: 6px 10px 4px;
  font-size: 9px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
  color: var(--text-subtle);
  display: flex; align-items: center; gap: 6px;
}
.nav-item {
  width: 100%;
  display: flex; align-items: center; gap: 8px;
  height: 30px; padding: 0 10px;
  border-radius: var(--radius-xs);
  color: var(--text-muted); font-size: 12px; font-weight: 600;
  text-align: left;
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.nav-item:hover { background: rgba(238,249,244,.05); color: var(--text-primary); }
.nav-item.is-active { background: rgba(172,231,46,.13); color: var(--accent); }
.nav-item .count {
  margin-left: auto;
  min-width: 18px; height: 17px; padding: 0 5px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 999px; background: rgba(231,76,60,.18); color: var(--danger);
  font-size: 9.5px; font-weight: 800; font-family: var(--font-mono);
}
.nav-item.is-child { padding-left: 22px; height: 27px; font-size: 11.5px; font-weight: 500; }

.admin__sidebar-foot { flex: none; padding: 10px; border-top: 1px solid var(--stroke); display: flex; flex-direction: column; gap: 6px; }

/* ---------- Контент ---------- */

.admin__content { flex: 1 1 auto; min-width: 0; min-height: 0; padding: 18px 20px 28px; }

.page-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
.page-title { font-size: 17px; font-weight: 800; letter-spacing: .01em; }
.page-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; max-width: 780px; line-height: 1.6; }
.page-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- Карточки ---------- */

.card {
  border: 1px solid var(--stroke);
  border-radius: var(--radius-sm);
  background: rgba(26,26,26,.6);
  padding: 14px;
}
.card__title { font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--text-subtle); margin-bottom: 10px; }

.grid { display: grid; gap: 12px; }
.grid--4 { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.grid--2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.grid--main { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }

.stat { display: flex; flex-direction: column; gap: 4px; }
.stat__value { font-size: 24px; font-weight: 800; font-family: var(--font-mono); letter-spacing: -.02em; line-height: 1.1; }
.stat__label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-subtle); }
.stat__hint { font-size: 10.5px; color: var(--text-muted); }

/* ---------- Таблицы ---------- */

.table-wrap { border: 1px solid var(--stroke); border-radius: var(--radius-sm); overflow: hidden; background: rgba(26,26,26,.45); }
table.data { width: 100%; border-collapse: collapse; font-size: 12px; }
table.data th {
  text-align: left; padding: 8px 12px;
  background: rgba(18,20,22,.8);
  border-bottom: 1px solid var(--stroke);
  font-size: 9.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-subtle);
  position: sticky; top: 0; z-index: 1;
}
table.data td { padding: 8px 12px; border-bottom: 1px solid rgba(238,249,244,.04); vertical-align: middle; }
table.data tr:last-child td { border-bottom: none; }
table.data tbody tr { transition: background var(--t-fast) var(--ease); }
table.data tbody tr:hover { background: rgba(238,249,244,.03); }
table.data tbody tr.is-clickable { cursor: pointer; }
table.data td.num { font-family: var(--font-mono); color: var(--text-muted); }
table.data td.actions { text-align: right; white-space: nowrap; }

.cell-user { display: flex; align-items: center; gap: 9px; min-width: 0; }
.cell-user .avatar { width: 26px; height: 26px; flex: none; }
.cell-user .name { font-weight: 600; }
.cell-user .sub { font-size: 10px; color: var(--text-subtle); font-family: var(--font-mono); }

/* ---------- Фильтры ---------- */

.toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.toolbar .field { width: auto; min-width: 180px; }
.toolbar .spacer { flex: 1 1 auto; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  height: 26px; padding: 0 11px;
  display: inline-flex; align-items: center; gap: 6px;
  border-radius: 999px; border: 1px solid var(--stroke);
  background: rgba(26,26,26,.7); color: var(--text-muted);
  font-size: 11px; font-weight: 600;
  transition: border-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
}
.chip:hover { color: var(--accent-bright); border-color: var(--stroke-strong); }
.chip.is-active { background: rgba(172,231,46,.14); border-color: var(--stroke-accent); color: var(--accent); }
.chip b { font-family: var(--font-mono); font-weight: 800; }

/* ---------- Карточка AI Report  ---------- */

.report-card { display: flex; flex-direction: column; gap: 12px; }
.report-card__head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.report-id { font-family: var(--font-mono); font-size: 15px; font-weight: 800; color: var(--danger); letter-spacing: .02em; }

.report-field { display: flex; flex-direction: column; gap: 5px; }
.report-field__label { font-size: 9.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--text-subtle); }
.report-field__value {
  font-size: 12.5px; line-height: 1.65; color: var(--text-primary);
  background: rgba(12,12,12,.4); border: 1px solid var(--stroke);
  border-radius: var(--radius-xs); padding: 9px 11px;
  white-space: pre-wrap; word-break: break-word;
}
.report-field__value--muted { color: var(--text-muted); }

.report-sources { display: flex; flex-direction: column; gap: 8px; }
.report-source {
  border: 1px solid var(--stroke); border-radius: var(--radius-xs);
  background: rgba(12,12,12,.35); padding: 9px 11px;
}
.report-source__title { font-size: 12px; font-weight: 700; }
.report-source__item { font-size: 11px; color: var(--accent-mid); font-weight: 600; margin-top: 1px; }
.report-source__meta { font-size: 10px; color: var(--text-subtle); margin-top: 4px; font-family: var(--font-mono); }
.report-source__text { font-size: 11.5px; color: var(--text-muted); margin-top: 6px; line-height: 1.6; max-height: 110px; overflow: hidden auto; white-space: pre-wrap; }

.report-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-top: 4px; border-top: 1px solid var(--stroke); }

/* ---------- Diff в админке ---------- */

.diff-view {
  white-space: pre-wrap; word-break: break-word;
  font-size: 12px; line-height: 1.75;
  background: rgba(12,12,12,.42);
  border: 1px solid var(--stroke);
  border-radius: var(--radius-xs);
  padding: 11px 13px;
}
.diff-legend { display: flex; gap: 14px; font-size: 10.5px; color: var(--text-subtle); margin-top: 8px; }
.diff-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.diff-del { color: #fff; background: rgba(231,76,60,.28); text-decoration: line-through; text-decoration-color: rgba(231,76,60,.85); border-radius: 3px; padding: 0 1px; }
.diff-ins { color: #0C0C0C; background: var(--accent); border-radius: 3px; padding: 0 2px; font-weight: 600; }

/* ---------- Раздел «Изменения»: две колонки  ---------- */

.split { display: grid; grid-template-columns: 260px minmax(0,1fr); gap: 12px; align-items: start; }
.split__list { border: 1px solid var(--stroke); border-radius: var(--radius-sm); background: rgba(26,26,26,.5); overflow: hidden; }
.split__list-group { padding: 8px 10px 4px; font-size: 9.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--text-subtle); }
.split__list-item {
  width: 100%; text-align: left; padding: 7px 10px;
  border-left: 2px solid transparent;

  /**
   * Окно подтверждения «Спросить ИИ?» в демо: отдельная мини-карточка рядом
   * с панелью (в приложении — BrowserWindow confirm.html поверх панели).
   * Возвращает promise: «Спросить»/Enter → true, «Отмена»/Esc → false.
   */
  let confirmResolveDemo = null;
  function resolveConfirmDemo(ok) {
    const r = confirmResolveDemo;
    confirmResolveDemo = null;
    if (r) r(ok);
  }
  function askConfirmDemo() {
    return new Promise((resolve) => {
      const slot = document.getElementById('demo-confirm-slot');
      if (!slot) { resolve(true); return; }
      if (confirmResolveDemo) { confirmResolveDemo(false); confirmResolveDemo = null; }
      slot.innerHTML = '';
      const holder = document.createElement('div');
      holder.className = 'demo-window demo-confirm';
      holder.innerHTML =
        '<div class="modal" style="position:static;background:transparent">' +
          '<div class="modal__box" style="box-shadow:none">' +
            '<div class="modal__title">Спросить ИИ?</div>' +
            '<div class="modal__quota"><span>Осталось сегодня</span><b data-role="quota">…</b></div>' +
            '<div class="modal__bar"><span data-role="bar" style="width:100%"></span></div>' +
            '<div class="modal__actions">' +
              '<button class="btn btn--ghost" data-role="cancel" type="button">Отмена<span class="modal__key">Esc</span></button>' +
              '<button class="btn btn--accent" data-role="ok" type="button">Спросить<span class="modal__key">Enter</span></button>' +
            '</div>' +
          '</div>' +
        '</div>';
      slot.appendChild(holder);
      const q = quotaInfo();
      holder.querySelector('[data-role=quota]').textContent = q.left + ' из ' + q.limit;
      holder.querySelector('[data-role=bar]').style.width = (q.limit > 0 ? Math.round((q.left / q.limit) * 100) : 0) + '%';
      const finish = (ok) => {
        if (confirmResolveDemo !== resolve) return;
        confirmResolveDemo = null;
        document.removeEventListener('keydown', onKey, true);
        slot.innerHTML = '';
        resolve(ok);
      };
      const onKey = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); finish(true); }
        else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
      };
      holder.querySelector('[data-role=ok]').onclick = () => finish(true);
      holder.querySelector('[data-role=cancel]').onclick = () => finish(false);
      document.addEventListener('keydown', onKey, true);
      confirmResolveDemo = resolve;
    });
  }



  function escapeHtmlDemo(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function highlightDemo(text, terms) {
    let out = escapeHtmlDemo(text);
    for (const t of terms) {
      const safe = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      out = out.replace(new RegExp('(' + safe + ')', 'gi'), '<mark>$1</mark>');
    }
    return out;
  }

  function fmtDemo(v) {
    if (!v) return '—';
    const d = new Date(v);
    if (Number.isNaN(d.getTime())) return '—';
    const p = (n) => String(n).padStart(2, '0');
    return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }


  /* ============================== FETCH-ШИМ ============================== */

  /**
   * В реальном Electron 33 fetch есть всегда. Шим нужен только окружениям без
   * fetch (jsdom в тестах, старые WebView) — иначе mock-backend не поднимется.
   */
  if (typeof window.fetch !== 'function') {
    window.fetch = function (input) {
      var url = typeof input === 'string' ? input : (input && input.url);
      return Promise.reject(new Error('fetch недоступен в этом окружении: ' + url));
    };
  }
  if (typeof window.Response === 'undefined') {
    window.Response = class Response {
      constructor(body, opts) {
        opts = opts || {};
        this._body = body;
        this.status = opts.status === undefined ? 200 : opts.status;
        this.ok = this.status >= 200 && this.status < 300;
        const h = opts.headers || {};
        this.headers = { get: (k) => (h[k] === undefined ? null : h[k]) };
      }
      text() { return Promise.resolve(this._body); }
      json() { return Promise.resolve(JSON.parse(this._body)); }
    };
  }

/* ============================== MOCK BACKEND ============================== */

  const realFetch = window.fetch.bind(window);
  window.fetch = async (input, init = {}) => {
    const url = typeof input === 'string' ? input : input.url;
    // Демо-ассеты (css/html соседних страниц) грузим реально
    if (!/\/api\//.test(url)) return realFetch(input, init);
    await sleep(120 + Math.random() * 220);
    const method = (init.method ?? 'GET').toUpperCase();
    const body = init.body ? JSON.parse(init.body) : {};
    const path = url.replace(/^https?:\/\/[^/]+/, '').split('?')[0];
    const query = new URLSearchParams(url.split('?')[1] ?? '');

    try {
      const data = await route(method, path, body, query);
      return json(200, data);
    } catch (e) {
      return json(e.status ?? 500, { error: e.code ?? 'error', message: e.message });
    }
  };

  function json(status, data) {
    return new Response(JSON.stringify(data), { status, headers: { 'Content-Type': 'application/json' } });
  }
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const fail = (status, code, message) => { const e = new Error(message); e.status = status; e.code = code; throw e; };

  async function route(method, path, body, query) {
    const perms = permsFor(currentRole);
    const need = (...p) => { if (!p.every((x) => perms.includes(x))) fail(403, 'forbidden', `Недостаточно прав: ${p.join(', ')}`); };

    /* ---- auth ---- */
    if (path === '/api/auth/me' && method === 'GET') {
      const u = { ...USER, primaryRole: { code: currentRole, name: roleByCode(currentRole).name, color: roleByCode(currentRole).color, level: roleByCode(currentRole).level } };
      return { authenticated: true, blocked: false, user: u, permissions: perms, maxRoleLevel: roleByCode(currentRole).level, isDeveloper: currentRole === 'developer' };
    }
    if (path === '/api/auth/logout') return { ok: true };
    if (path === '/api/auth/providers') return { telegram: true, devLogin: false, botUsername: 'EpicAIHelper_bot' };

    /* ---- AI ---- */
    if (method === 'DELETE' && /^\/api\/users\/\d+$/.test(path)) {
      const id = Number(path.split('/')[3]);
      const i = USERS.findIndex((x) => x.id === id);
      if (i >= 0) USERS.splice(i, 1);
      return { ok: true };
    }
    if (path === '/api/telegram/status' && method === 'GET') {
      return {
        enabled: true, username: 'EpicAIHelper_bot', polling: true, subscribers: 3,
        notifyKbUpdates: true,
        recent: [{ at: new Date(Date.now() - 3600_000).toISOString(), author: 'developer', text: 'Обновление правил сервера, раздел 4.3', sent: 3, failed: 0 }],
      };
    }
    if (path === '/api/telegram/settings' && method === 'PUT') return { ok: true, notifyKbUpdates: Boolean(body.notifyKbUpdates) };
    if (path === '/api/telegram/broadcast' && method === 'POST') return { ok: true, sent: 3, failed: 0, subscribers: 3 };
    if (path === '/api/ai/ask' && method === 'POST') {
      need('ai.use');
      const mode = body.mode === 'laws' ? 'laws' : 'rules';
      const found = mockSearch(String(body.question ?? ''), mode);
      const requestId = nextRequestId++;
      quotaUsed += 1;
      if (!found.length) {
        lastAnswer = { requestId, mode, question: body.question, verdict: 'unknown', status: 'no_data', sources: [] };
        HISTORY.unshift({ requestId, mode, question: String(body.question), verdict: 'unknown', createdAt: new Date().toISOString() });
        return { ...lastAnswer, verdictLabel: 'Нет подтверждённых данных', explanation: 'В официальной базе EpicRP не найдено подтверждённой информации для однозначного ответа.', basis: null, noData: true, kbVersion: '6-20261005', latencyMs: 420, provider: 'groq', model: 'llama-3.3-70b-versatile', confidence: 0, feedback: { allowed: true, vote: null }, relatedDocuments: [], quota: quotaInfo() };
      }
      const answer = mockAnswer(body.question, mode, found);
      lastAnswer = { requestId, ...answer };
      HISTORY.unshift({ requestId, mode, question: String(body.question), verdict: answer.verdict, createdAt: new Date().toISOString() });
      return { requestId, mode, question: body.question, status: 'ok', provider: 'groq', model: 'llama-3.3-70b-versatile', latencyMs: 1180, kbVersion: '6-20261005', noData: false, relatedDocuments: [], feedback: { allowed: true, vote: null }, quota: quotaInfo(), ...answer };
    }
    if (path === '/api/ai/quota' && method === 'GET') {
      need('ai.use');
      return quotaInfo();
    }
    if (path === '/api/ai/sources' && method === 'GET') {
      return { requestId: Number(query.get('requestId')), mode: lastAnswer?.mode ?? 'rules', question: lastAnswer?.question ?? '', kbVersion: '6-20261005', createdAt: new Date().toISOString(), sources: lastAnswer?.sources ?? [] };
    }
    if (path === '/api/ai/transcribe' && method === 'POST') {
      return { text: 'Можно ли красить транспорт в виниловый цвет?', provider: 'mock-whisper' };
    }
    if (path === '/api/ai/feedback/categories') {
      return {
        items: [
          { id: 'misinterpreted', label: 'Неверно истолковано правило' }, { id: 'wrong_article', label: 'Неправильная статья' },
          { id: 'outdated', label: 'Устаревшая информация' }, { id: 'wrong_source', label: 'Неверный источник' },
          { id: 'technical', label: 'Техническая ошибка' }, { id: 'other', label: 'Другое' },
        ],
        analysis: [{ id: 'kb_outdated', label: 'Устарела база' }, { id: 'search_miss', label: 'Ошибка поиска' }, { id: 'ai_error', label: 'Ошибка AI' }, { id: 'technical', label: 'Техническая ошибка' }],
      };
    }
    if (path === '/api/ai/feedback/like' && method === 'POST') { votes.set(body.requestId, 1); return { ok: true, requestId: body.requestId, vote: 1, reportCreated: false }; }
    if (path === '/api/ai/reports' && method === 'POST') {
      need('ai.feedback');
      if (!body.category) fail(400, 'bad_request', 'Категория ошибки должна быть выбрана');
      const id = nextReportId++;
      REPORTS = [{
        id, requestId: body.requestId, userId: USER.id, username: USER.username, avatarUrl: null, userRole: roleByCode(currentRole).name,
        mode: lastAnswer?.mode ?? 'rules', question: lastAnswer?.question ?? '', verdict: lastAnswer?.verdict ?? 'unknown',
        explanation: lastAnswer?.explanation ?? '', basis: lastAnswer?.basis ?? null,
        category: body.category, categoryLabel: ({ misinterpreted: 'Неверно истолковано правило', wrong_article: 'Неправильная статья', outdated: 'Устаревшая информация', wrong_source: 'Неверный источник', technical: 'Техническая ошибка', other: 'Другое' })[body.category],
        comment: body.comment ?? null, status: 'new', analysis: body.category === 'outdated' ? 'kb_outdated' : 'ai_error',
        analysisLabel: body.category === 'outdated' ? 'Устарела база' : 'Ошибка AI', resolution: null, handledBy: null, handledAt: null,
        createdAt: new Date().toISOString(), kbVersion: '6-20261005', sources: lastAnswer?.sources ?? [],
      }, ...REPORTS];
      votes.set(body.requestId, -1);
      return { ok: true, reportId: id, requestId: body.requestId, status: 'new', suggestedAnalysis: body.category === 'outdated' ? 'kb_outdated' : 'ai_error' };

  const STOP = new Set(['что', 'такое', 'можно', 'нельзя', 'ли', 'какой', 'какая', 'как', 'это', 'или', 'если', 'при', 'для', 'по', 'в', 'на', 'и', 'а', 'не', 'с', 'о', 'к', 'из', 'до', 'за', 'то', 'бы', 'же', 'вы', 'мы', 'он', 'она', 'они', 'есть', 'мне', 'меня', 'его', 'её', 'их', 'чем', 'когда', 'где', 'почему', 'зачем', 'какие', 'каких', 'этом', 'этот', 'эта', 'эти', 'мне', 'вас']);

  function tokens(s) {
    return String(s ?? '').toLowerCase().match(/[a-zа-яё0-9]{2,}/gi)?.filter((t) => !STOP.has(t)) ?? [];
  }
  function stemOf(t) { return t.length > 5 ? t.slice(0, Math.max(3, t.length - 2)) : t; }

  function mockSearch(question, mode) {
    const q = tokens(question);
    const stems = q.map(stemOf);
    const docType = mode === 'laws' ? 'LAW' : 'RULE';
    const scored = [];
    for (const d of KB_DOCS) {
      if (d.docType !== docType || d.status !== 'active') continue;
      const text = `${d.title}\n${d.text}`.toLowerCase();
      let score = 0;
      const matched = new Set();
      for (let i = 0; i < q.length; i++) {
        const t = q[i]; const st = stems[i];
        const hits = (text.match(new RegExp(st.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g')) ?? []).length;
        if (hits) { score += Math.log(1 + hits) * (t.length > 4 ? 1.4 : 1); matched.add(t); }
      }
      if (score > 0) scored.push({ doc: d, score, matched: [...matched] });
    }
    scored.sort((a, b) => b.score - a.score);

    const out = [];
    for (const s of scored.slice(0, 3)) {
      // выбираем наиболее релевантный фрагмент (по номеру пункта/статьи)
      const paras = s.doc.text.split(/\n\n+/);
      let best = paras[0]; let bestScore = -1;
      for (const p of paras) {
        const lower = p.toLowerCase();
        let sc = 0;
        for (const st of s.matched.map(stemOf)) sc += (lower.match(new RegExp(st.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g')) ?? []).length;
        if (sc > bestScore) { bestScore = sc; best = p; }
      }
      const heading = best.split('\n')[0].slice(0, 90);
      out.push({
        index: out.length, chunkId: s.doc.id * 10 + out.length, documentId: s.doc.id, versionId: s.doc.version, version: s.doc.version,
        docType: s.doc.docType, docTypeLabel: s.doc.docType === 'LAW' ? 'Законодательная база' : 'Правила',
        title: s.doc.title, category: s.doc.category, section: s.doc.section, heading,
        content: best, url: s.doc.url, revisionLabel: fmt(s.doc.sourceModifiedAt), sourceModifiedAt: s.doc.sourceModifiedAt,
        threadId: s.doc.threadId, postId: s.doc.postId, score: Number(s.score.toFixed(2)), matchedTerms: s.matched, openLabel: 'Открыть источник ↗',
      });
    }
    return out;
  }

  function mockAnswer(question, mode, sources) {
    const q = String(question).toLowerCase();
    const first = sources[0];
    const cite = `${first.title}${first.heading ? `, ${first.heading}` : ''}`;

    let verdict = 'depends';
    let explanation;
    if (/запрещ|нельзя|запрещено/.test(first.content)) verdict = 'forbidden';
    else if (/обязан|разреш|допускается/.test(first.content)) verdict = 'allowed';

    if (/dm|deathmatch|без причин|убивать/.test(q)) {
      verdict = 'forbidden';
      explanation = 'Убивать игрока или наносить ему урон без весомой IC причины запрещено — это DM (DeathMatch). Весомой причиной считается правильно отыгранная RP ситуация с предупреждением, самооборона при нападении или исполнение служебных обязанностей сотрудником государственной организации.';
    } else if (/удостовер|документ/.test(q)) {
      verdict = 'allowed';
      explanation = 'Да: сотрудник обязан предоставить удостоверение личности при проверке, если игрок об этом попросил. Игрок, в свою очередь, обязан предоставить документы по первому требованию сотрудника.';
    } else if (/зелён|зелен/.test(q)) {
      verdict = 'forbidden';
      explanation = 'В зелёных зонах запрещены любые противоправные действия, включая DM, DB, ограбления и похищения. Отыгрыш маски или другой подготовки это ограничение не отменяет.';
    } else if (/убийств|статья 12/.test(q)) {

      explanation = 'Убийство первой степени наказывается лишением свободы сроком на 150 месяцев и штрафом 200000 виртуальной валюты. Убийство второй степени — 80 месяцев и штраф 90000.';

    } else {
      explanation = `По вашему вопросу найден официальный документ. ${first.content.split('\n').slice(-1)[0].slice(0, 220)}`;
    }

    return {
      verdict,
      verdictLabel: { allowed: 'Разрешено', forbidden: 'Запрещено', depends: 'Зависит от обстоятельств', unknown: 'Нет подтверждённых данных' }[verdict],
      explanation,
      basis: `${cite}: «${first.content.split('\n').slice(-1)[0].slice(0, 240)}»`,
      confidence: 0.82,
      sources,
    };
  }

/**
 * EPIC AI — утилиты renderer'а.
 */

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
    else if (k === 'dataset') Object.assign(node.dataset, v);
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v === true) node.setAttribute(k, '');
    else node.setAttribute(k, String(v));
  }
  for (const c of [].concat(children)) {
    if (c === null || c === undefined || c === false) continue;
    node.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
  return node;
}

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

function clear(node) { while (node && node.firstChild) node.removeChild(node.firstChild); return node; }

/** Формат даты: 05.10.2026 20:14 */
function fmtDateTime(value, withTime = true) {
  if (!value) return '—';
  const d = value instanceof Date ? value : new Date(String(value));
  if (Number.isNaN(d.getTime())) return '—';
  const p = (n) => String(n).padStart(2, '0');
  const date = `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()}`;
  return withTime ? `${date} ${p(d.getHours())}:${p(d.getMinutes())}` : date;
}

function fmtDate(value) { return fmtDateTime(value, false); }

function relativeTime(value) {
  if (!value) return '—';
  const d = new Date(String(value)).getTime();
  if (Number.isNaN(d)) return '—';
  const diff = Date.now() - d;
  const min = Math.round(diff / 60000);
  if (min < 1) return 'только что';
  if (min < 60) return `${min} мин назад`;
  const h = Math.round(min / 60);
  if (h < 24) return `${h} ч назад`;
  const days = Math.round(h / 24);
  if (days < 8) return `${days} дн назад`;
  return fmtDate(value);
}

function plural(n, one, few, many) {
  const mod10 = n % 10;
  const mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return one;
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return few;
  return many;
}

function debounce(fn, ms = 250) {
  let t = null;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/**
 * Подсветка найденных терминов внутри текста (: Accent — «выделение
 * найденных элементов»). Работает по текстовому узлу, без innerHTML-инъекций.
 */
function highlight(text, terms) {
  const frag = document.createDocumentFragment();
  const src = String(text ?? '');
  const words = [...new Set((terms ?? []).map((t) => String(t).trim()).filter((t) => t.length >= 2))]
   .sort((a, b) => b.length - a.length);
  if (!words.length) { frag.appendChild(document.createTextNode(src)); return frag; }

  const pattern = new RegExp(`(${words.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})`, 'gi');
  let last = 0;
  for (const m of src.matchAll(pattern)) {
    const idx = m.index ?? 0;
    if (idx > last) frag.appendChild(document.createTextNode(src.slice(last, idx)));
    const mark = document.createElement('mark');
    mark.textContent = m[0];
    mark.style.cssText = 'background:rgba(172,231,46,.20);color:#E2FF3F;border-radius:3px;padding:0 2px';
    frag.appendChild(mark);
    last = idx + m[0].length;
  }
  if (last < src.length) frag.appendChild(document.createTextNode(src.slice(last)));
  return frag;
}

function toast(message, ms = 2600) {
  const node = document.getElementById('toast');
  if (!node) return;
  node.textContent = message;
  node.classList.add('is-visible');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => node.classList.remove('is-visible'), ms);
}

/** Открывает внешнюю ссылку в системном браузере. */
async function openExternal(url) {
  if (!url) return false;
  try {
    if (window.epicAI?.invoke) return await window.epicAI.invoke('epic:external', url);

}

function initials(name) {
  const parts = String(name ?? '?').trim().split(/[\s_.-]+/).filter(Boolean);
  if (!parts.length) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

function avatarNode(url, name, cls = 'avatar') {

/**
 * Случайный ник для режима стримера: настоящий ник не светится в стриме.
 * Ник НЕ постоянный: main process перегенерирует его при каждом запуске

/**
 * EPIC AI — HTTP-клиент renderer'а.
 *
 * Renderer ходит ТОЛЬКО на backend. Cookie сессии живёт в партиции
 * Electron и подставляется автоматически. Заголовок X-Epic-Client обязателен
 * для мутирующих запросов (защита от CSRF).
 */

let backendUrl = 'http://127.0.0.1:8787';

/**
 * Токен сессии для заголовка Authorization.
 *
 * Окна renderer'а работают с file://, а Chromium не отправляет cookie
 * с непрозрачного origin — поэтому токен приходит из main process через IPC
 * (канал epic:session:token) и передаётся заголовком. В браузере
 * (например, /ui/admin.html с самого backend) токена нет — работают cookie.
 */
let authToken = null;

function setBackendUrl(url) {
  backendUrl = String(url || '').replace(/\/$/, '');
}
function getBackendUrl() { return backendUrl; }

async function initAuth() {
  try {
    authToken = (await window.epicAI?.invoke('epic:session:token')) ?? null;
  } catch { authToken = null; }
  return authToken;
}
function getAuthToken() { return authToken; }

class ApiError extends Error {
  constructor(status, code, message) {
    super(message || `HTTP ${status}`);
    this.status = status;
    this.code = code;
  }
}

async function request(method, path, body, opts = {}) {
  const headers = { 'X-Epic-Client': 'desktop',...(opts.headers || {}) };
  if (authToken) headers.Authorization = `Bearer ${authToken}`;
  if (body !== undefined) headers['Content-Type'] = 'application/json';

  let res;
  try {
    res = await fetch(`${backendUrl}${path}`, {
      method,
      headers,
      credentials: 'include',
      body: body === undefined ? undefined : JSON.stringify(body),
      signal: AbortSignal.timeout(opts.timeout ?? 60_000),
    });
  } catch (e) {
    throw new ApiError(0, 'network_error', `Backend недоступен: ${e.message}`);
  }

  // Сессия могла появиться/обновиться уже после старта окна (вход в другом
  // окне) — один раз перечитываем токен и повторяем запрос.
  if (res.status === 401 && !opts._retried) {
    const token = await initAuth();
    if (token) return request(method, path, body, {...opts, _retried: true });
  }

  const text = await res.text();
  let json = null;
  if (text) { try { json = JSON.parse(text); } catch { json = { raw: text.slice(0, 500) }; } }

  if (!res.ok) {
    throw new ApiError(res.status, json?.error ?? 'error', json?.message ?? `HTTP ${res.status}`);
  }
  return json;
}

const api = {
  get: (p, o) => request('GET', p, undefined, o),
  post: (p, b, o) => request('POST', p, b ?? {}, o),
  put: (p, b, o) => request('PUT', p, b ?? {}, o),
  patch: (p, b, o) => request('PATCH', p, b ?? {}, o),
  del: (p, o) => request('DELETE', p, undefined, o),
};

   * Распознаёт backend (Groq Whisper); ключ API в клиент не передаётся.

  transcribe: async (blob) => {
    const headers = { 'X-Epic-Client': 'desktop' };
    // П.2 раунда 34: ArrayBuffer-тело (раунд 28) не несёт неявного
    // Content-Type, а Fastify без него отвечает 415 Unsupported Media Type —

        // data-pipe upload, из-за которого Chromium логил

        body: await blob.arrayBuffer(),

      });
    } catch (e) {
      throw new ApiError(0, 'network_error', `Backend недоступен: ${e.message}`);
    }
    const text = await res.text();
    let json = null;
    if (text) { try { json = JSON.parse(text); } catch { json = { raw: text.slice(0, 300) }; } }
    if (!res.ok) throw new ApiError(res.status, json?.error ?? 'error', json?.message ?? `HTTP ${res.status}`);

 * пилюли пользователя. Теперь окно удалено: содержимое профиля рисуется
 * вкладкой «Профиль» внутри выпадающей области настроек основной панели.
 *
 * Состав (референс пользователя): шапка (аватар, имя, роль, «@ник · вход
 * через Telegram»), карточка «Ответы ИИ сегодня» с остатком дневного лимита
 * и прогресс-баром, карточка выхода из аккаунта (+ вход в админ-панель для
 * администрации), сводка аккаунта.
 */

/** «вход через Telegram» / «вход через Discord» — по привязанным identity. */
function providerLabel(u) {
  const ids = u?.identities ?? [];
  if (ids.some((i) => i.provider === 'telegram')) return 'вход через Telegram';
  if (ids.some((i) => i.provider === 'discord')) return 'вход через Discord';
  return 'внешний провайдер';
}

function displayName(ctx, u) {
  if (ctx.settings?.streamerMode) return ctx.settings.streamerNick || 'Стример';
  return u?.displayName || u?.username || '—';
}

function headCard(ctx, u) {
  const ava = ctx.settings?.streamerMode
    ? streamerAvatarNode('prof-ava', u.avatarUrl, u.displayName || u.username)
    : avatarNode(u.avatarUrl, u.displayName || u.username, 'prof-ava');
  return el('div', { class: 'prof-head' }, [
    ava,
    el('div', { class: 'prof-id' }, [
      el('div', { class: 'prof-name' }, displayName(ctx, u)),
      u.primaryRole
        ? el('span', { class: 'role-pill', style: { color: u.primaryRole.color } }, [el('span', { class: 'dot' }), u.primaryRole.name])
        : null,
      el('div', { class: 'prof-login' }, ctx.settings?.streamerMode ? '@•••••• · стрим-режим' : `@${u.username ?? '—'} · ${providerLabel(u)}`),
    ]),
  ]);
}

/** Карточка «Ответы ИИ сегодня»: крупный остаток + прогресс-бар + подпись. */
function quotaCard() {
  const big = el('div', { class: 'prof-quota__big' }, '…');
  const bar = el('span', { style: { width: '100%' } });
  const caption = el('div', { class: 'prof-caption' }, 'Загружаем лимит…');
  const card = el('div', { class: 'prof-card' }, [
    el('div', { class: 'prof-card__title' }, 'Ответы ИИ сегодня'),
    big,
    el('div', { class: 'prof-bar' }, bar),
    caption,
  ]);
  void Ai.quota().then((q) => {
    const left = Number(q?.left ?? 0);
    const limit = Number(q?.limit ?? 0);
    big.textContent = '';
    big.classList.toggle('is-empty', left <= 0);
    big.append(
      el('b', {}, `${left} из ${limit}`),
      el('span', {}, 'осталось'),
    );
    bar.style.width = limit > 0 ? `${Math.round((left / limit) * 100)}%` : '0%';
    const reset = q?.resetAt ? fmtDateTime(q.resetAt) : '00:00 по Москве';
    caption.textContent = `Новые ответы появятся в ${reset} — лимит сбрасывается ежедневно${q?.personal ? ' (персональный лимит выдан администратором)' : ''}.`;
  }).catch(() => {
    big.textContent = '';
    big.appendChild(el('b', {}, '—'));
    caption.textContent = 'Лимит недоступен: backend не отвечает.';
    bar.style.width = '0%';
  });
  return card;
}

/** Карточка «Выйти из аккаунта» + (для администрации) «Админ панель». */
function logoutCard(ctx) {
  return el('div', { class: 'prof-card' }, [
    el('div', { class: 'prof-card__title' }, 'Выйти из аккаунта'),
    el('div', { class: 'prof-logout__row' }, [
      el('div', { class: 'prof-logout__text' }, 'Сессия будет отозвана, а Epic AI вернётся к окну входа. Настройки аккаунта сохранятся на сервере.'),
      el('button', {
        class: 'btn btn--danger', type: 'button',
        onClick: () => { ctx.onLogout?.(); },
      }, 'Выйти'),
    ]),
    ctx.canAdmin
      ? el('div', { class: 'prof-logout__row' }, [
          el('div', { class: 'prof-logout__text' }, 'Управление пользователями, ошибками ИИ и базой знаний.'),
          el('button', {
            class: 'btn', type: 'button',
            onClick: () => { ctx.onOpenAdmin?.(); },
          }, 'Админ панель'),
        ])
      : null,
  ]);
}

/** Короткая сводка аккаунта (даты, провайдеры) — внизу раздела. */
function detailsCard(u) {
  const line = (name, value) => el('div', { class: 'prof-detail__row' }, [
    el('span', {}, name),
    el('b', { class: 'mono' }, value),
  ]);
  return el('div', { class: 'prof-card prof-details' }, [
    el('div', { class: 'prof-card__title' }, 'Аккаунт'),
    line('ID', `#${u.id ?? '—'}`),
    line('Статус', u.status === 'active' ? 'active' : String(u.status ?? '—')),
    line('Аккаунт создан', fmtDateTime(u.createdAt)),
    line('Последний вход', fmtDateTime(u.lastLoginAt)),
  ]);
}

/**
 * Раздел «Профиль» настроек. Контекст — тот же, что передаёт main.js
 * в initSettings(): user, permissions, settings, canAdmin, onLogout, onOpenAdmin.
 */
function buildProfileSection(ctx) {
  const host = el('div', { class: 'set-page' });
  const u = ctx.user;
  if (!u) {
    host.appendChild(el('div', { class: 'empty' }, 'Нет данных пользователя — требуется вход.'));
    return host;
  }
  host.append(
    el('div', { style: { display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '6px' } }, [
      el('button', {
        class: 'btn btn--ghost btn--sm', type: 'button',
        onClick: () => ctx.onNavigate?.('main'),
      }, '← к настройкам'),
      el('span', { class: 'section-title', style: { margin: '0' } }, 'Профиль и аккаунт'),
    ]),
    headCard(ctx, u),
    quotaCard(),
    logoutCard(ctx),
    detailsCard(u),
  );
  return host;
}




/* ==== settings.js ==== */
/**
 * EPIC AI — настройки панели (референс-стиль: сайдбар + строки-карточки).
 *
 * Разделы (по требованиям пользователя):
 *   Основное · Правила · Клавиши · Производительность · Частые вопросы
 *
 * Вкладки «Интерфейс» НЕТ: прозрачность перенесена в «Основное».
 * Вкладки «Профиль» НЕТ: профиль открывается отдельным окном (profile.html)
 * по клику на шапку меню пользователя или пункт «Профиль и аккаунт».
 *
 * Настройки НЕ открывают отдельное окно: панель разворачивается вниз.
 */



/* ------------------------------------------------------------------ */
/*  Применение визуальных настроек к DOM                               */
/* ------------------------------------------------------------------ */

function applyVisualSettings(s) {
  const root = document.documentElement;
  const op = clamp(s.opacity ?? 0.82, 0.35, 1);
  root.style.setProperty('--panel-alpha', op.toFixed(3));
  root.style.setProperty('--surface-alpha', clamp(Math.min(1, op + 0.02), 0.3, 1).toFixed(3));
  root.style.setProperty('--muted-alpha', clamp(op - 0.05, 0.25, 1).toFixed(3));
  root.style.setProperty('--base-alpha', clamp(Math.min(1, op + 0.08), 0.3, 1).toFixed(3));
  root.style.setProperty('--drop-alpha', clamp(Math.min(1, op + 0.14), 0.3, 1).toFixed(3));
  root.dataset.lowperf = s.lowPerformanceMode ? 'true' : 'false';
  // Режим стримера: аватары размываются CSS-ом, ники подменяются в main.js
  root.dataset.streamer = s.streamerMode ? 'true' : 'false';
}

function clamp(v, min, max) { const n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : min; }

/* ------------------------------------------------------------------ */
/*  Иконки разделов                                                     */
/* ------------------------------------------------------------------ */

const I = {
  main: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h10M18 8h2M4 16h4M12 16h8"/><circle cx="16" cy="8" r="2.2"/><circle cx="10" cy="16" r="2.2"/></svg>',
  perf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2.5L5 13.5h5.5L10 21.5l8-11h-5.5z"/></svg>',
  rules: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9.5 12h6M9.5 16h6"/></svg>',
  keys: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="2.5" y="6.5" width="19" height="11" rx="2.5"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M6 13.5h.01M18 13.5h.01M9 13.5h6" stroke-linecap="round"/></svg>',
  faq: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.8.35-1.9-1 1.8"/><path d="M12 16.8v.2"/></svg>',
};

/**
 * Разделы настроек (требования пользователя):
 *  — вкладка «Интерфейс» УБРАНА: прозрачность переехала в «Основное»;
 *  — вкладка «Профиль» ВЕРНУТА в настройки (п.4, п.5): отдельное окно профиля
 *    удалено, пилюля пользователя открывает настройки сразу на ней.
 */
const SECTIONS = [
  { id: 'main', label: 'Основное', icon: I.main },
  { id: 'rules', label: 'Правила', icon: I.rules },
  { id: 'keys', label: 'Клавиши', icon: I.keys },
  { id: 'perf', label: 'Производительность', icon: I.perf },
  { id: 'faq', label: 'Частые вопросы', icon: I.faq },
];

/**
 * Скрытые разделы: «Профиль» НЕ показывается в навигации настроек
 * (п.2 раунда 19) — в него попадает только клик по пилюле пользователя
 * (п.3), внутри есть кнопка возврата к настройкам.
 */
const HIDDEN_SECTIONS = ['profile'];

function isKnownSection(id) {
  return Boolean(id) && (SECTIONS.some((s) => s.id === id) || HIDDEN_SECTIONS.includes(id));
}

/* ------------------------------------------------------------------ */
/*  Контекст                                                            */
/* ------------------------------------------------------------------ */

let ctx = null;
let activeSection = null;

function initSettings(context) { ctx = context; }

function renderSettings(container, section) {
  if (!ctx) return;
  activeSection = isKnownSection(section) ? section : 'main';

  const side = container.querySelector('#settings-side');
  const pages = container.querySelector('#settings-pages');
  if (!side || !pages) return;

  /* --- сайдбар: карточка пользователя, навигация, версия --- */
  clear(side);
  const u = ctx.user ?? {};
  side.append(
    el('div', { class: 'side-user' }, [
      // Режим стримера: настоящее фото, сильно размытое (п.2)
      ctx.settings?.streamerMode
        ? streamerAvatarNode('side-user__ava', u.avatarUrl, u.displayName || u.username)
        : avatarNode(u.avatarUrl, u.displayName || u.username, 'side-user__ava'),
      el('div', { style: { minWidth: '0' } }, [
        el('div', { class: 'side-user__name' }, ctx.settings?.streamerMode ? (ctx.settings.streamerNick || u.displayName || '—') : (u.displayName || u.username || '—')),
        el('div', { class: 'side-user__nick' }, ctx.settings?.streamerMode ? '@••••••' : `@${u.username ?? '—'}`),
      ]),
    ]),
    el('nav', { class: 'set-nav' }, SECTIONS.map((s) => el('button', {
      class: `settings__nav-item${s.id === activeSection ? ' is-active' : ''}`,
      type: 'button',
      onClick: () => ctx.onNavigate?.(s.id),
    }, [el('span', { html: s.icon, style: { display: 'inline-flex', width: '15px', height: '15px' } }), s.label]))),
    el('div', { class: 'side-foot' }, [
      el('span', { class: 'dot', id: 'side-status-dot' }),
      el('span', { id: 'side-version' }, `v${ctx.appVersion ?? '1.0.0'}`),
      el('span', { class: 'grow' }),
      el('span', { id: 'side-kb' }, 'база: …'),
    ]),
  );
  void refreshSideStatus();

  /* --- страница --- */
  // П.8: клик по элементу ВНУТРИ раздела не должен отматывать список наверх.
  // Скролл сбрасывается только при СМЕНЕ раздела, а перерисовка того же
  // раздела (переключатель, сохранение настройки) сохраняет позицию.
  const sameSection = pages.dataset.section === activeSection;
  const keepScroll = sameSection ? pages.scrollTop : 0;
  clear(pages);
  pages.appendChild(buildSection(activeSection));
  pages.dataset.section = activeSection;
  pages.scrollTop = keepScroll;
  ctx.onResize?.(measureHeight(activeSection));
}

async function refreshSideStatus() {
  const dot = document.getElementById('side-status-dot');
  const kb = document.getElementById('side-kb');
  if (!dot || !kb) return;
  try {
    const st = await Kb.status();
    kb.textContent = `база: ${st.documents.active} док. · ${st.stateLabel.toLowerCase()}`;
    dot.className = `dot${st.state === 'error' ? ' err' : ''}`;
    dot.style.background = st.stateColor;
    dot.style.boxShadow = `0 0 8px ${st.stateColor}`;
  } catch {
    kb.textContent = 'база недоступна';
    dot.className = 'dot err';
  }
}

/**
 * Высота области настроек ФИКСИРОВАННАЯ и не зависит от вкладки: окно не
 * «прыгает» при переключении разделов, содержимое скроллится внутри
 * .set-main.scroll.
 */
function measureHeight(_section) {
  return 520;
}

/* ------------------------------------------------------------------ */
/*  Конструкторы строк                                                  */
/* ------------------------------------------------------------------ */

function page(title, sub,...nodes) {
  return el('div', {}, [
    el('div', { class: 'set-title' }, title),
    sub ? el('div', { class: 'set-sub' }, sub) : el('div', { style: { height: '12px' } }),
   ...nodes,
  ]);
}

function card(...rows) {
  return el('div', { class: 'opt-card' }, rows.filter(Boolean));
}

function row(name, desc, control) {
  return el('div', { class: 'opt-row' }, [
    el('div', { class: 'opt-row__label' }, [
      el('div', { class: 'opt-row__name' }, name),
      desc ? el('div', { class: 'opt-row__desc' }, desc) : null,
    ]),
    el('div', { class: 'opt-row__control' }, [].concat(control)),
  ]);
}

function toggle(key, current, onChange) {
  const input = el('input', { type: 'checkbox' });
  input.checked = Boolean(current);
  input.addEventListener('change', () => onChange(key, input.checked));
  return el('label', { class: 'switch' }, [input, el('span', { class: 'track' }), el('span', { class: 'thumb' })]);
}

function select(key, current, options, onChange) {
  const sel = el('select', { class: 'sel' }, options.map((o) => el('option', { value: o.value,...(String(o.value) === String(current) ? { selected: true } : {}) }, o.label)));
  sel.value = String(current);
  sel.addEventListener('change', () => onChange(key, sel.value));
  return sel;
}

function range(key, current, { min, max, step, format }, onChange) {
  const value = el('span', { class: 'range-value' }, format(current));
  const input = el('input', { class: 'range', type: 'range', min: String(min), max: String(max), step: String(step) });
  input.value = String(current);
  input.addEventListener('input', () => { value.textContent = format(Number(input.value)); });
  input.addEventListener('change', () => onChange(key, Number(input.value)));
  return [input, value];
}

/** Кейкапы: 'Ctrl+Shift+P' → [Ctrl][Shift][P]. */
function kbdRow(combo, { editable = false, onEdit } = {}) {
  const parts = String(combo ?? '').split('+').filter(Boolean);
  const wrap = el('span', { class: `kbd-row${editable ? ' is-editable' : ''}` }, parts.map((p) => el('span', { class: p.length > 2 ? 'kbd kbd--wide' : 'kbd' }, p)));
  if (editable && onEdit) wrap.addEventListener('click', () => onEdit(wrap));
  return wrap;
}

/* ------------------------------------------------------------------ */
/*  Разделы                                                             */
/* ------------------------------------------------------------------ */

function buildSection(id) {
  const s = ctx.settings;
  switch (id) {
    case 'profile': return buildProfileSection(ctx);
    case 'main': return pageMain(s);
    case 'perf': return pagePerf(s);
    case 'rules': return pageRules();
    case 'keys': return pageKeys(s);
    case 'faq': return pageFaq();
    default: return pageMain(s);
  }
}

/* ---------- Основное  ---------- */

function pageMain(s) {
  const change = ctx.onChange;
  return page('Основное', 'Горячая клавиша, окно, прозрачность, микрофон и режим стримера — всё, что нужно каждый день.',
    card(
      row('Горячая клавиша', 'Показать или скрыть окно поверх игры', kbdRow(s.hotkey, {
        editable: true,
        onEdit: (wrap) => captureHotkey(wrap, s.hotkey, async (acc) => {
          const res = await window.epicAI?.invoke('epic:hotkey:set', acc).catch(() => null);
          if (res?.ok) { change('hotkey', res.requested); toast(`Горячая клавиша: ${res.requested}`); }
          else toast('Сочетание занято системой — оставлено прежнее');
        }),
      })),
      row('Поверх всех окон', 'Держать оверлей поверх игры (уровень screen-saver). Закреплённое окно НЕ прячется при клике по игре', toggle('alwaysOnTop', s.alwaysOnTop, change)),
      row('Запускать вместе с Windows', 'Автозапуск в свёрнутом виде', toggle('autostart', s.autostart, change)),
      // Прозрачность переехала сюда из убранной вкладки «Интерфейс»
      row('Прозрачность', 'Общая полупрозрачность панели и выпадающих областей', range('opacity', s.opacity, { min: 0.4, max: 1, step: 0.02, format: (v) => `${Math.round(v * 100)}%` }, change)),
      // Выбор устройства микрофона для голосового ввода (п.13)
      row('Микрофон', 'Устройство записи для голосовых запросов', micDeviceSelect(s.micDeviceId, change)),
    ),
    card(
      row('Скрывать при клике вне окна', 'Клик по игре прячет панель и источники; приложение остаётся в трее. Не работает, пока окно закреплено звёздочкой', toggle('hideOnOutsideClick', s.hideOnOutsideClick, change)),
      row('Очищать предыдущий ответ', 'Новый вопрос заменяет старый ответ', toggle('clearPreviousAnswer', s.clearPreviousAnswer, change)),
      row('Сохранять выбранный режим', 'Запоминать «Правила» / «Законы» между запусками', toggle('rememberMode', s.rememberMode, change)),
      row('Режим по умолчанию', 'Если сохранение выключено', select('defaultMode', s.defaultMode, [
        { value: 'rules', label: 'Правила' }, { value: 'laws', label: 'Законы' },
      ], change)),
      row('Подтверждать вопрос', 'Перед отправкой показывать отдельное окно «Спросить ИИ?» с остатком запросов на сегодня', toggle('confirmAiAsk', s.confirmAiAsk !== false, change)),
    ),
    card(
      row('Режим стримера', 'Скрывает настоящее имя и лицо: случайный ник вместо вашего, вместо аватара — нейтральная заглушка', toggle('streamerMode', s.streamerMode, async (k, v) => {
        // Ник генерируется ЗАНОВО при каждом включении режима (требование
        // пользователя) — и дополнительно при каждом запуске приложения.
        if (v) await ctx.onChange('streamerNick', streamerName());
        await ctx.onChange(k, v);
      })),
      s.streamerMode && s.streamerNick
        ? row('Ник в стриме', 'Меняется при каждом запуске приложения и включении режима', el('span', { class: 'mono', style: { fontSize: '11px' } }, s.streamerNick))
        : null,
    ),
    el('div', { class: 'kb-note' }, 'Панель можно перетащить за любое свободное место — она останется там, где вы её оставили. Живой фон (съёмка экрана под окном) убран полностью: он нагружал систему и мешал игре.'),
  );
}

/**
 * Селект устройства микрофона (п.13): список audioinput из
 * navigator.mediaDevices.enumerateDevices(). Названия устройств браузер
 * отдаёт только после разрешения на микрофон — до этого показываем
 * «Микрофон N». Значение сохраняется в настройке micDeviceId.
 */
function micDeviceSelect(current, onChange) {
  const sel = el('select', { class: 'sel', style: { maxWidth: '190px' } });
  sel.appendChild(el('option', { value: '' }, 'По умолчанию'));
  sel.value = String(current ?? '');
  sel.addEventListener('change', () => onChange('micDeviceId', sel.value || null));
  const fill = async () => {
    try {
      if (!navigator.mediaDevices?.enumerateDevices) throw new Error('нет mediaDevices');
      const devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'audioinput');
      if (!devices.length) throw new Error('нет устройств');
      devices.forEach((d, i) => {
        sel.appendChild(el('option', { value: d.deviceId }, d.label || `Микрофон ${i + 1}`));
      });
      sel.value = String(current ?? '');
      if (sel.selectedIndex < 0) sel.value = '';
    } catch {
      // Нет доступа к списку устройств (или окружение без mediaDevices) —
      // оставляем только «По умолчанию».
      sel.title = 'Список устройств недоступен — используется устройство по умолчанию';
    }
  };
  void fill();
  return sel;
}

/** Перехват сочетания клавиш для горячей клавиши. */
function captureHotkey(wrap, fallback, onDone) {
  let listening = false;
  const caps = () => [...wrap.querySelectorAll('.kbd')];
  const onKey = (e) => {
    if (!listening) return;
    e.preventDefault(); e.stopPropagation();
    if (e.key === 'Escape') { stop(); return; }
    if (['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) return;
    const parts = [];
    if (e.ctrlKey || e.metaKey) parts.push('Ctrl');
    if (e.altKey) parts.push('Alt');
    if (e.shiftKey) parts.push('Shift');
    let key = e.key;
    if (key === ' ') key = 'Space';
    else if (key.length === 1) key = key.toUpperCase();
    parts.push(key);
    stop();
    void onDone(parts.join('+'));
  };
  const start = () => { listening = true; wrap.classList.add('is-listening'); clear(wrap); wrap.appendChild(el('span', { class: 'kbd kbd--wide' }, 'Нажмите сочетание…')); window.addEventListener('keydown', onKey, true); };
  const stop = () => { listening = false; wrap.classList.remove('is-listening'); window.removeEventListener('keydown', onKey, true); clear(wrap); String(fallback).split('+').forEach((p) => wrap.appendChild(el('span', { class: p.length > 2 ? 'kbd kbd--wide' : 'kbd' }, p))); };
  start();
}

/** Локальная дата YYYY-MM-DD — ключ дня для списка изменений базы. */

  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;

function rulesChip(label, n) {

/* ==== kbview.js ==== */
/**
 * EPIC AI — просмотр базы знаний: обновления за день и история изменений.
 *
 * По требованию пользователя кнопки «Посмотреть» и «История изменений»
 * раскрывают базу знаний ВНУТРИ панели (pane-kb в main.html: список изменений
 * за день слева с фильтрами-чипами, «было / стало» с цветным diff справа),
 * ВНЕ настроек. Админка ре-использует renderDiff для word-level сравнения.
 */

/* ------------------------------------------------------------------ */
/*  Обновления за день                                     */
/* ------------------------------------------------------------------ */

/**
 * @param {string|null} day ISO-день (YYYY-MM-DD) или null = сегодня
 * @param {{onDay?: (day: string|null) => void}} [opts]
 */
function buildUpdatesView(day, opts = {}) {
  const wrap = el('div', { style: { display: 'flex', flexDirection: 'column', height: '100%', minHeight: '0' } });
  const shell = el('div', { class: 'upd-shell' });
  const left = el('div', { class: 'upd-left' }, [el('div', { class: 'empty', style: { flex: '1' } }, [el('span', { class: 'spinner' })])]);
  const detail = el('div', { class: 'upd-detail selectable' }, [el('div', { class: 'empty' }, [el('span', { class: 'spinner' })])]);
  shell.append(left, detail);
  wrap.appendChild(shell);
  void loadUpdates(left, detail, day ?? null, opts);
  return wrap;
}

/** Сегодняшний день в ISO (YYYY-MM-DD) — для заголовка «Изменения правил». */
function todayIso() { return new Date().toISOString().slice(0, 10); }

async function loadUpdates(left, detail, day, opts) {
  let data;
  try { data = day ? await Kb.changes(day) : await Kb.today(); }
  catch (e) { clear(left); left.appendChild(el('div', { class: 'empty', style: { flex: '1' } }, e.message ?? 'База недоступна')); return; }

  const counts = data.counts ?? {};
  const total = (counts.new ?? 0) + (counts.updated ?? 0) + (counts.archived ?? 0);
  const filters = [
    { id: 'all', label: 'все', count: total },
    { id: 'UPDATED', label: 'изменены', count: counts.updated ?? 0 },
    { id: 'NEW', label: 'новые', count: counts.new ?? 0 },
    { id: 'ARCHIVED', label: 'архив', count: counts.archived ?? 0 },
  ];
  let filter = 'all';

  const list = el('div', { class: 'upd-list' });
  const chips = el('div', { class: 'upd-chips' });

  clear(left);
  left.append(
    el('div', { class: 'upd-head' }, [
      el('div', { class: 'set-title', style: { margin: '0' } }, 'Изменения правил'),
      el('span', { class: 'upd-head__date' }, fmtDate(`${(day ?? todayIso())}T12:00:00Z`)),
      el('span', { class: 'grow' }),
      day ? el('button', { class: 'btn btn--ghost btn--sm', type: 'button', onClick: () => opts.onDay?.(null) }, 'Сегодня') : null,
    ]),
    chips,
    list,
  );

  if (!data.items?.length) {
    chips.hidden = true;
    list.remove();
    left.appendChild(el('div', { class: 'empty', style: { flex: '1' } }, [
      el('div', {}, 'Изменений за этот день нет'),
      el('div', { class: 'subtle', style: { fontSize: '10.5px' } }, 'База обновляется при запуске приложения и по расписанию; новые редакции появятся здесь.'),
    ]));
    clear(detail);
    detail.appendChild(el('div', { class: 'empty' }, 'Выберите изменение слева'));
    return;
  }

  function drawChips() {
    clear(chips);
    for (const f of filters) {
      if (f.id !== 'all' && !f.count) continue;
      const b = el('button', {
        class: `upd-chip${filter === f.id ? ' is-active' : ''}`, type: 'button',
        onClick: () => { filter = f.id; drawChips(); drawList(); },
      }, [el('i', {}), `${f.label} ${f.count}`]);
      chips.appendChild(b);
    }
  }

  function drawList() {
    clear(list);
    const items = filter === 'all' ? data.items : data.items.filter((i) => i.changeKind === filter);
    if (!items.length) {
      list.appendChild(el('div', { class: 'empty' }, 'Нет событий этого типа'));
      return;
    }
    const groups = [
      { title: 'Изменён пункт', kind: 'UPDATED', items: items.filter((i) => i.changeKind === 'UPDATED') },
      { title: 'Новый пункт', kind: 'NEW', items: items.filter((i) => i.changeKind === 'NEW') },
      { title: 'Отправлено в архив', kind: 'ARCHIVED', items: items.filter((i) => i.changeKind === 'ARCHIVED') },
    ];
    const btns = [];
    for (const g of groups) {
      if (!g.items.length) continue;
      list.appendChild(el('div', { class: 'upd-group' }, [
        el('span', {}, g.title),
        el('span', { class: 'upd-group__count' }, String(g.items.length)),
      ]));
      for (const it of g.items) {
        const b = el('button', {
          class: 'upd-item', type: 'button',
          onClick: () => { btns.forEach((x) => x.classList.remove('is-active')); b.classList.add('is-active'); void loadChangeDetail(detail, it.id); },
        }, [
          el('div', {}, it.title),
          el('div', { class: 'meta' }, [
            it.changeKind === 'UPDATED' ? el('span', { class: 'badge', style: { color: 'var(--accent)', height: '17px' } }, `±${it.changedWords ?? 0} сл.`) : null,
            el('span', { class: 'badge', style: { textTransform: 'none', height: '17px' } }, it.docType === 'LAW' ? 'закон' : 'правило'),
          ]),
        ]);
        btns.push(b);
        list.appendChild(b);
      }
    }
    if (btns[0]) btns[0].click();
  }

  drawChips();
  drawList();
}

async function loadChangeDetail(container, changeId) {
  clear(container);
  container.appendChild(el('div', { class: 'empty' }, [el('span', { class: 'spinner' })]));
  let d;
  try { d = await Kb.change(changeId); } catch (e) { clear(container); container.appendChild(el('div', { class: 'empty' }, e.message ?? 'Не удалось загрузить редакцию')); return; }

  clear(container);
  container.appendChild(el('div', { style: { display: 'flex', flexDirection: 'column', gap: '11px' } }, [
    el('div', { style: { display: 'flex', alignItems: 'center', gap: '8px', flexWrap: 'wrap' } }, [
      d.isNew ? el('span', { class: 'badge badge--accent' }, '🟢 новое правило') : el('span', { class: 'badge', style: { color: 'var(--warning)' } }, `изменено · v${d.before?.version ?? '?'} → v${d.after.version}`),
      !d.isNew && d.diff ? el('span', { class: 'badge', style: { color: 'var(--accent)', textTransform: 'none' } }, `добавлено ${wc(d.diff.addedText)}`) : null,
      !d.isNew && d.diff ? el('span', { class: 'badge', style: { color: 'var(--danger)', textTransform: 'none' } }, `убрано ${wc(d.diff.removedText)}`) : null,
      el('span', { class: 'badge', style: { textTransform: 'none' } }, d.document.docType === 'LAW' ? 'законодательная база' : 'правила'),
      el('span', { class: 'grow' }),
      el('button', { class: 'btn btn--sm', type: 'button', onClick: () => openExternal(d.document.url) }, 'Открыть источник ↗'),
    ]),
    el('div', { class: 'set-title', style: { margin: '0' } }, d.document.title),
    d.document.section ? el('div', { class: 'set-sub', style: { margin: '-6px 0 0' } }, d.document.section) : null,
    el('div', { class: 'kv' }, [
      el('dt', {}, 'Дата редакции'), el('dd', { class: 'mono' }, fmtDateTime(d.document.sourceModifiedAt)),
      el('dt', {}, 'Дата создания'), el('dd', { class: 'mono' }, fmtDateTime(d.document.sourceCreatedAt)),
      el('dt', {}, 'Изменено слов'), el('dd', { class: 'mono' }, String(d.change.changedWords)),
    ]),
    d.isNew
      ? el('div', {}, [
          el('div', { class: 'answer__label', style: { marginBottom: '6px' } }, 'Полный текст'),
          el('div', { class: 'diff-view selectable', style: { color: 'var(--accent)' } }, d.after.text),
        ])
      : el('div', {}, [
          el('div', { class: 'answer__label', style: { marginBottom: '6px' } }, 'Было / стало'),
          renderDiff(d.diff),
          el('div', { class: 'diff-legend' }, [
            el('span', {}, [el('i', { style: { background: 'var(--danger)' } }), 'удалённый текст']),
            el('span', {}, [el('i', { style: { background: 'var(--accent)' } }), 'добавленный текст']),
          ]),
        ]),
  ]));
}

/** Количество слов в тексте diff-фрагмента. */
function wc(text) {
  const m = String(text ?? '').trim().match(/[\p{L}\p{N}]+/gu);
  return m ? m.length : 0;
}

/** Цветной word-level diff : 🔴 #E74C3C, 🟢 #ACE72E. */
function renderDiff(diff) {
  const box = el('div', { class: 'diff-view selectable' });
  if (!diff?.ops?.length) { box.appendChild(el('div', { class: 'subtle' }, 'Изменений нет')); return box; }
  for (const op of diff.ops) {
    if (op.kind === 'equal') box.appendChild(document.createTextNode(op.text));
    else if (op.kind === 'del') box.appendChild(el('span', { style: { color: '#fff', background: 'rgba(231,76,60,.28)', textDecoration: 'line-through', textDecorationColor: 'rgba(231,76,60,.85)', borderRadius: '3px', padding: '0 1px' } }, op.text));
    else box.appendChild(el('span', { style: { color: '#000', background: 'var(--accent)', borderRadius: '3px', padding: '0 2px', fontWeight: '600' } }, op.text));   // 'ins'
  }
  return box;
}

/** @param {{onOpenDay?: (day: string) => void}} [opts] */
function buildHistoryView(opts = {}) {
  const wrap = el('div', { style: { display: 'flex', flexDirection: 'column', height: '100%', minHeight: '0' } });
  wrap.appendChild(el('div', { style: { display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '12px' } }, [
    el('div', { class: 'set-title', style: { margin: '0' } }, 'История изменений'),
    el('span', { class: 'grow' }),
    el('span', { class: 'subtle', style: { fontSize: '10.5px' } }, 'Выберите день, чтобы посмотреть редакции'),
  ]));
  const list = el('div', { class: 'kb-hist' }, [el('div', { class: 'empty' }, [el('span', { class: 'spinner' })])]);
  wrap.appendChild(list);
  void (async () => {
    let data;
    try { data = await Kb.history(90); } catch (e) { clear(list); list.appendChild(el('div', { class: 'empty' }, e.message ?? 'База недоступна')); return; }
    clear(list);
    if (!data.items?.length) {
      list.appendChild(el('div', { class: 'empty' }, [
        el('div', {}, 'История пуста'),
        el('div', { class: 'subtle', style: { fontSize: '10.5px' } }, 'После первой синхронизации здесь появятся дни с изменениями документов.'),
      ]));
      return;
    }
    for (const d of data.items) {
      list.appendChild(el('div', { class: 'kb-hist__row' }, [
        el('div', { class: 'kb-hist__date' }, fmtDate(`${d.day}T12:00:00Z`)),
        el('div', { class: 'kb-hist__sum' }, d.summary),
        el('button', { class: 'btn btn--sm', type: 'button', onClick: () => opts.onOpenDay?.(d.day) }, 'Открыть'),
      ]));
    }
  })();
  return wrap;
}
