<!DOCTYPE html>
<html lang="ru" data-blur="true" data-animations="true" data-lowperf="false">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Epic AI — демо окна источников</title>
<!-- Демо-страница Epic AI: mock-backend встроен, сеть не требуется -->
<style>
/* ============================================================
   EPIC AI — дизайн-токены 
   Единственный источник цветов. Значения синхронизированы с
   shared/tokens.js, который используют backend и Electron.
   ============================================================ */

:root {
  /* Accent */
  --accent:        #ACE72E;   /* активные элементы, выбранные состояния, CTA, успех, подсветка найденного */
  --accent-bright: #E2FF3F;   /* hover, focus, яркая подсветка */
  --accent-mid:    #72CE1C;   /* иконки, вторичные акценты, маркеры */

  /* Backgrounds */
  --bg-base:    #0C0C0C;      /* самый тёмный фон */
  --bg-dark:    #121416;      /* основная панель, карточки, шапки */
  --bg-surface: #1A1A1A;      /* поля ввода, поверхности */
  --bg-muted:   #2A2A2A;      /* вторичные поверхности */

  /* Text */
  --text-primary: #EEF9F4;
  --text-muted:   #888888;
  --text-subtle:  #666666;

  /* States */
  --danger:  #E74C3C;         /* ошибки и удалённый текст в diff */
  --warning: #F87171;         /* предупреждения, «есть обновления» */
  --info:    #3498DB;

  /* Роли  */
  --role-player:       #888888;
  --role-helper:       #72CE1C;
  --role-admin:        #3498DB;
  --role-senior-admin: #9B59B6;
  --role-deputy-chief: #E67E22;
  --role-chief-admin:  #E74C3C;
  --role-project-lead: #F1C40F;
  --role-developer:    #E2FF3F;

  /* Прозрачность главной панели  */
  --panel-alpha: 0.82;
  --surface-alpha: 0.78;
  --muted-alpha: 0.72;
  --base-alpha: 0.90;
  --drop-alpha: 0.96;

  --glass-panel:   rgba(18, 20, 22, var(--panel-alpha));
  --glass-surface: rgba(26, 26, 26, var(--surface-alpha));
  --glass-muted:   rgba(42, 42, 42, var(--muted-alpha));
  --glass-base:    rgba(12, 12, 12, var(--base-alpha));

  --stroke:        rgba(238, 249, 244, 0.08);
  --stroke-strong: rgba(238, 249, 244, 0.14);
  --stroke-accent: rgba(172, 231, 46, 0.35);

  --radius: 12px;
  --radius-sm: 8px;
  --radius-xs: 6px;

  /* Длительности переходов фиксированные: отдельной настройки анимаций нет */
  --t-fast: 120ms;
  --t-base: 180ms;
  --t-slow: 280ms;
  --ease: cubic-bezier(.22,.61,.36,1);

  --font: "Segoe UI", "Inter", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Cascadia Mono", "JetBrains Mono", Consolas, "Courier New", monospace;
}

/* Blur отключаем одной переменной — настройка «blur»  */
html[data-lowperf="true"] { --t-fast: 0ms; --t-base: 0ms; --t-slow: 0ms; }


/* ============================================================
   EPIC AI — базовые стили (общие для всех окон)
   : тёмное, полупрозрачное, компактное, мягкий blur,
   минимум визуального шума, работа поверх игры.
   ============================================================ */

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: transparent;          /* прозрачное окно Electron */
  color: var(--text-primary);
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.45;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body { user-select: none; }

/* Выделение текста разрешаем только в содержательных областях */
.selectable, .answer-text, .source-text, .diff-view, pre, code, input, textarea {
  user-select: text;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(238, 249, 244, 0.12);
  border-radius: 8px;
}
::-webkit-scrollbar-thumb:hover { background: rgba(172, 231, 46, 0.35); }

a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-bright); }

button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }

/* ---------- Утилиты ---------- */

.glass {
  background: var(--glass-panel);
  border: 1px solid var(--stroke);
}

.muted { color: var(--text-muted); }
.subtle { color: var(--text-subtle); }
.accent { color: var(--accent); }
.danger { color: var(--danger); }
.warning { color: var(--warning); }
.mono { font-family: var(--font-mono); }

.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.gap-4 { gap: 4px; } .gap-6 { gap: 6px; } .gap-8 { gap: 8px; }
.gap-10 { gap: 10px; } .gap-12 { gap: 12px; } .gap-16 { gap: 16px; }
.grow { flex: 1 1 auto; min-width: 0; }
.nowrap { white-space: nowrap; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.center { display: flex; align-items: center; justify-content: center; }

.divider { height: 1px; background: var(--stroke); flex: none; }
.divider-v { width: 1px; background: var(--stroke); align-self: stretch; flex: none; }

/* ---------- Кнопки ---------- */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px; padding: 0 12px;
  border-radius: var(--radius-xs);
  border: 1px solid var(--stroke);
  background: var(--bg-surface);
  color: var(--text-primary);
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
  white-space: nowrap;
}
.btn:hover { border-color: var(--accent-bright); color: var(--accent-bright); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 1px; }
.btn[disabled] { opacity: .4; pointer-events: none; }

.btn--accent {
  background: var(--accent);
  border-color: var(--accent-bright);
  color: #0C0C0C;
}
.btn--accent:hover { background: var(--accent-bright); border-color: var(--accent-bright); color: #0C0C0C; }

/* П.6: у кнопок ВИДНА обводка — ghost больше не сливается с фоном. */
.btn--ghost { background: rgba(255,255,255,.03); border-color: rgba(255,255,255,.28); color: var(--text-primary); }
.btn--ghost:hover { color: var(--accent-bright); background: rgba(226, 255, 63, 0.06); border-color: var(--accent-bright); }

.btn--danger { border-color: rgba(231, 76, 60, .4); color: var(--danger); }
.btn--danger:hover { background: rgba(231, 76, 60, .14); border-color: var(--danger); color: #fff; }

.btn--sm { height: 24px; padding: 0 8px; font-size: 10px; }
.btn--lg { height: 38px; padding: 0 18px; font-size: 12px; }

.icon-btn {
  width: 30px; height: 30px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--radius-xs);
  color: var(--text-muted);
  transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
}
.icon-btn:hover { color: var(--accent-bright); background: rgba(226, 255, 63, 0.08); }
.icon-btn.is-active { color: var(--accent); }
.icon-btn svg { width: 16px; height: 16px; }

/* ---------- Бейджи / метки ---------- */

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  height: 20px; padding: 0 8px;
  border-radius: 999px;
  border: 1px solid var(--stroke);
  background: var(--glass-surface);
  font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  color: var(--text-muted);
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.badge--accent { color: var(--accent); border-color: var(--stroke-accent); background: rgba(172,231,46,.08); }
.badge--danger { color: var(--danger); border-color: rgba(231,76,60,.35); background: rgba(231,76,60,.10); }
.badge--warning { color: var(--warning); border-color: rgba(248,113,113,.35); background: rgba(248,113,113,.10); }
.badge--mid { color: var(--accent-mid); border-color: rgba(114,206,28,.35); background: rgba(114,206,28,.10); }

.tag {
  display: inline-block; padding: 1px 6px; border-radius: 4px;
  background: rgba(238,249,244,.06); color: var(--text-muted);
  font-size: 10px; letter-spacing: .03em;
}

/* ---------- Заголовки секций ---------- */

.section-title {
  font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
  color: var(--text-subtle);
}

/* ---------- Поля ввода ---------- */

.field {
  height: 30px; padding: 0 10px;
  background: var(--glass-surface);
  border: 1px solid var(--stroke);
  border-radius: var(--radius-xs);
  color: var(--text-primary);
  transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
  width: 100%;
}
.field::placeholder { color: var(--text-subtle); }
.field:hover { border-color: var(--stroke-strong); }
.field:focus { outline: none; border-color: var(--accent); background: rgba(26,26,26,.95); }
.field:focus-visible { box-shadow: 0 0 0 2px rgba(226,255,63,.18); }
textarea.field { height: auto; padding: 8px 10px; resize: vertical; line-height: 1.5; }
select.field { appearance: none; padding-right: 26px; cursor: pointer; }

/* ---------- Переключатель ---------- */

.switch { position: relative; width: 34px; height: 18px; flex: none; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch .track {
  position: absolute; inset: 0; border-radius: 999px;
  background: var(--bg-muted); border: 1px solid var(--stroke);
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
}
.switch .thumb {
  position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--text-muted);
  transition: transform var(--t-base) var(--ease), background var(--t-fast) var(--ease);
}
.switch input:checked ~ .track { background: rgba(172,231,46,.22); border-color: var(--stroke-accent); }
.switch input:checked ~ .thumb { transform: translateX(16px); background: var(--accent); }
.switch input:focus-visible ~ .track { box-shadow: 0 0 0 2px rgba(226,255,63,.25); }

/* ---------- Спиннер ---------- */

.spinner {
  width: 14px; height: 14px; flex: none;
  border: 2px solid rgba(172,231,46,.22);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 700ms linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Пульсация статуса ---------- */

.pulse { animation: pulse 1600ms ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

/* ---------- Скролл-области ---------- */

.scroll { overflow-y: auto; overflow-x: hidden; }
.scroll::-webkit-scrollbar { width: 6px; }

/* ============================================================
   EPIC AI — окно источников 
   Отдельное окно справа от основной панели.
   ============================================================ */

body { height: 100vh; }

.sources {
  display: flex; flex-direction: column;
  height: 100vh;
  border-radius: var(--radius);
  overflow: hidden;
  /* Тень-ореол вокруг окна убрана (требование пользователя: за приложением
     не должно быть «фона») — внутренний блик оставлен. */
  box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
}

.sources__head {
  flex: none;
  display: flex; align-items: center; gap: 8px;
  height: 38px; padding: 0 8px 0 12px;
  border-bottom: 1px solid var(--stroke);
  background: rgba(18,20,22,calc(var(--panel-alpha, .82) - .20));
  -webkit-app-region: drag;
}
.sources__head .icon-btn, .sources__head .badge { -webkit-app-region: no-drag; }

.sources__question {
  flex: none;
  padding: 8px 12px;
  border-bottom: 1px solid var(--stroke);
  font-size: 11.5px; color: var(--text-muted); line-height: 1.5;
  background: rgba(12,12,12,calc(var(--panel-alpha, .82) - .52));
  max-height: 62px; overflow: hidden;
}
.sources__question b { color: var(--text-primary); font-weight: 600; }

.sources__body { flex: 1 1 auto; min-height: 0; padding: 10px; display: flex; flex-direction: column; gap: 10px; }

.sources__foot {
  flex: none;
  display: flex; align-items: center; gap: 8px;
  height: 28px; padding: 0 12px;
  border-top: 1px solid var(--stroke);
  background: rgba(18,20,22,calc(var(--panel-alpha, .82) - 0.32));
}

/* ---------- Карточка источника  ---------- */

.src-card {
  flex: none;
  border: 1px solid var(--stroke);
  border-radius: var(--radius-sm);
  background: var(--glass-surface);
  overflow: hidden;
  transition: border-color var(--t-fast) var(--ease);
}
.src-card:hover { border-color: var(--stroke-strong); }

.src-card__head {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 9px 11px 8px;
  border-bottom: 1px solid rgba(238,249,244,.05);
  background: rgba(12,12,12,calc(var(--panel-alpha, .82) - .54));
}
.src-card__num {
  flex: none;
  width: 19px; height: 19px; margin-top: 1px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 5px;
  background: rgba(172,231,46,.15);
  border: 1px solid rgba(172,231,46,.3);
  color: var(--accent);
  font-size: 10px; font-weight: 800; font-family: var(--font-mono);
}
.src-card__titles { min-width: 0; flex: 1 1 auto; }
.src-card__doc {
  font-size: 12px; font-weight: 700; color: var(--text-primary);
  line-height: 1.35;
}
.src-card__item {
  margin-top: 2px;
  font-size: 11px; font-weight: 600; color: var(--accent-mid);
  letter-spacing: .02em;
}
.src-card__kind {
  flex: none; align-self: center;
}

.src-card__meta {
  display: flex; flex-wrap: wrap; gap: 6px 12px;
  padding: 7px 11px;
  font-size: 10px; color: var(--text-subtle);
  border-bottom: 1px solid rgba(238,249,244,.05);
}
.src-card__meta span b { color: var(--text-muted); font-weight: 600; }
.src-card__meta .mono { font-family: var(--font-mono); }

.src-card__text {
  padding: 10px 11px;
  font-size: 12px; line-height: 1.65; color: var(--text-primary);
  white-space: pre-wrap; word-break: break-word;
  max-height: 210px; overflow: hidden auto;
}
.src-card__text mark { background: rgba(172,231,46,.2); color: var(--accent-bright); border-radius: 3px; padding: 0 2px; }

.src-card__foot {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 11px;
  border-top: 1px solid rgba(238,249,244,.05);
  background: rgba(12,12,12,calc(var(--panel-alpha, .82) - .60));
}
.src-open {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--accent);
  padding: 3px 8px; margin-left: -8px;
  border-radius: var(--radius-xs);
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.src-open:hover { background: rgba(172,231,46,.12); color: var(--accent-bright); }
.src-open svg { width: 11px; height: 11px; }

.src-related {
  padding: 8px 11px;
  border: 1px dashed var(--stroke);
  border-radius: var(--radius-sm);
  background: rgba(12,12,12,calc(var(--panel-alpha, .82) - .57));
}
.src-related__title { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-subtle); margin-bottom: 6px; }
.src-related__item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-muted); padding: 2px 0; }

.src-nodata {
  border: 1px solid rgba(248,113,113,.28);
  background: rgba(248,113,113,.07);
  border-radius: var(--radius-sm);
  padding: 12px;
  font-size: 12px; line-height: 1.6; color: var(--text-muted);
}
.src-nodata b { color: var(--warning); }

      text: `1. Основные термины Roleplay
RP - (RolePlay) - игра по ролям, где игроки должны придерживаться выбранной роли.
DM - (DeathMatch) - убийство или нанесение урона игроку без весомой на то причины.
DB - (Drive By) - убийство игрока с помощью средства передвижения.
MG - (Meta Gaming) - смешивание или использование OOC информации в IC.
PG - (Power Gaming) - преувеличение возможностей своего персонажа.
NLR - (New Life Rule) - новый персонаж не может использовать знания предыдущих персонажей игрока.

3. DeathMatch (DM)
3.1. Запрещено убивать или наносить урон игрокам без весомой IC причины.
3.2. Весомой причиной считается: правильно отыгранная RP ситуация с предупреждением, самооборона при нападении, исполнение служебных обязанностей сотрудником государственной организации.
3.3. Наказание за нарушение пункта 3.1: блокировка аккаунта сроком до 7 суток с конфискацией имущества, использованного при нарушении.

4. Поведение при проверке документов
4.1. Игрок обязан предоставлять документы по первому требованию сотрудника правоохранительных органов.
4.2. Сотрудник обязан предоставить удостоверение личности при проверке, если игрок об этом попросил.
4.3. Запрещено скрываться от проверки документов, находясь в транспортном средстве.

5. Правила зелёных зон
5.1. В зелёных зонах запрещены любые противоправные действия: DM, DB, ограбления, похищения.
5.2. К зелёным зонам относятся территории государственных организаций, больницы, места проведения массовых мероприятий.
5.3. Запрещено находиться в зелёной зоне с расчехлённым оружием.`,

      text: `2. Применение силы
2.1. Применение оружия допустимо только при наличии прямой угрозы жизни сотрудника или гражданских лиц.
2.2. Перед применением оружия сотрудник обязан произвести устное предупреждение и выстрел в воздух, если обстановка это позволяет.
2.3. Запрещено применять оружие к лицу, которое не оказывает сопротивления и выполнило требования сотрудника.

3. Задержание
3.1. Задержание производится только при наличии оснований, предусмотренных Penal Code штата Сан-Андреас.

      text: `Статья 2. Права и свободы человека
2.1. Каждый имеет право на жизнь, свободу и личную неприкосновенность.
2.2. Никто не может быть подвергнут аресту иначе как на основании закона и в установленном законом порядке.
2.3. Каждому гарантируется право на квалифицированную юридическую помощь.
2.4. Каждый обвиняемый считается невиновным, пока его виновность не будет установлена вступившим в законную силу решением суда.

Статья 4. Судебная власть
4.1. Правосудие в штате Сан-Андреас осуществляется только судом.
4.2. Судебная власть независима и подчиняется исключительно закону.`,

      sourceCreatedAt: '2026-05-02T10:00:00.000Z', sourceModifiedAt: '2026-10-05T11:20:00.000Z', status: 'active', version: 4,
      text: `Статья 12.1. Убийство первой степени
Умышленное убийство при отягчающих обстоятельствах наказывается лишением свободы сроком на 150 месяцев и штрафом в размере 200000 виртуальной валюты.

Статья 12.2. Убийство второй степени
Умышленное убийство без отягчающих обстоятельств наказывается лишением свободы сроком на 80 месяцев и штрафом в размере 90000 виртуальной валюты.

Статья 12.4. Похищение человека
Похищение человека наказывается лишением свободы сроком на 100 месяцев и штрафом в размере 120000 виртуальной валюты.

Статья 21.3. Разбой
Нападение с целью хищения имущества с применением оружия наказывается лишением свободы сроком на 110 месяцев и штрафом в размере 140000 виртуальной валюты.

Статья 31.1. Незаконный оборот оружия
Хранение и перевозка оружия без соответствующего разрешения наказывается лишением свободы сроком на 45 месяцев и штрафом в размере 60000 виртуальной валюты.`,

      sourceCreatedAt: '2026-05-04T09:00:00.000Z', sourceModifiedAt: '2026-08-11T09:00:00.000Z', status: 'active', version: 2,
      text: `Статья 3. Порядок судебного заседания
3.1. Судебное заседание открывается оглашением состава суда и сути обвинения.
3.2. Стороны представляют свои доводы и доказательства.
3.3. Решение суда оглашается публично и вступает в силу с момента оглашения.

Статья 4. Обжалование

    const scored = [];
    for (const d of KB_DOCS) {

    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v === true) node.setAttribute(k, '');
    else node.setAttribute(k, String(v));
  }
  for (const c of [].concat(children)) {
    if (c === null || c === undefined || c === false) continue;
    node.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
  return node;
}

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

function clear(node) { while (node && node.firstChild) node.removeChild(node.firstChild); return node; }

/** Формат даты: 05.10.2026 20:14 */
function fmtDateTime(value, withTime = true) {
  if (!value) return '—';
  const d = value instanceof Date ? value : new Date(String(value));
  if (Number.isNaN(d.getTime())) return '—';
  const p = (n) => String(n).padStart(2, '0');
  const date = `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()}`;
  return withTime ? `${date} ${p(d.getHours())}:${p(d.getMinutes())}` : date;
}

function fmtDate(value) { return fmtDateTime(value, false); }

function relativeTime(value) {
  if (!value) return '—';
  const d = new Date(String(value)).getTime();
  if (Number.isNaN(d)) return '—';
  const diff = Date.now() - d;
  const min = Math.round(diff / 60000);
  if (min < 1) return 'только что';
  if (min < 60) return `${min} мин назад`;
  const h = Math.round(min / 60);
  if (h < 24) return `${h} ч назад`;
  const days = Math.round(h / 24);
  if (days < 8) return `${days} дн назад`;
  return fmtDate(value);
}

function plural(n, one, few, many) {
  const mod10 = n % 10;
  const mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return one;
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return few;
  return many;
}

function debounce(fn, ms = 250) {
  let t = null;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/**
 * Подсветка найденных терминов внутри текста (: Accent — «выделение
 * найденных элементов»). Работает по текстовому узлу, без innerHTML-инъекций.
 */
function highlight(text, terms) {
  const frag = document.createDocumentFragment();
  const src = String(text ?? '');
  const words = [...new Set((terms ?? []).map((t) => String(t).trim()).filter((t) => t.length >= 2))]
   .sort((a, b) => b.length - a.length);
  if (!words.length) { frag.appendChild(document.createTextNode(src)); return frag; }

  const pattern = new RegExp(`(${words.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})`, 'gi');
  let last = 0;
  for (const m of src.matchAll(pattern)) {
    const idx = m.index ?? 0;
    if (idx > last) frag.appendChild(document.createTextNode(src.slice(last, idx)));
    const mark = document.createElement('mark');
    mark.textContent = m[0];
    mark.style.cssText = 'background:rgba(172,231,46,.20);color:#E2FF3F;border-radius:3px;padding:0 2px';
    frag.appendChild(mark);
    last = idx + m[0].length;
  }
  if (last < src.length) frag.appendChild(document.createTextNode(src.slice(last)));
  return frag;
}

function toast(message, ms = 2600) {
  const node = document.getElementById('toast');
  if (!node) return;
  node.textContent = message;
  node.classList.add('is-visible');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => node.classList.remove('is-visible'), ms);
}

/** Открывает внешнюю ссылку в системном браузере. */
async function openExternal(url) {
  if (!url) return false;

}

function initials(name) {
  const parts = String(name ?? '?').trim().split(/[\s_.-]+/).filter(Boolean);
  if (!parts.length) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

/* ==== api.js ==== */
/**
 * EPIC AI — HTTP-клиент renderer'а.
 *
 * Renderer ходит ТОЛЬКО на backend. Cookie сессии живёт в партиции
 * Electron и подставляется автоматически. Заголовок X-Epic-Client обязателен
 * для мутирующих запросов (защита от CSRF).
 */

let backendUrl = 'http://127.0.0.1:8787';

/**
 * Токен сессии для заголовка Authorization.
 *
 * Окна renderer'а работают с file://, а Chromium не отправляет cookie
 * с непрозрачного origin — поэтому токен приходит из main process через IPC
 * (канал epic:session:token) и передаётся заголовком. В браузере
 * (например, /ui/admin.html с самого backend) токена нет — работают cookie.
 */
let authToken = null;

function setBackendUrl(url) {
  backendUrl = String(url || '').replace(/\/$/, '');
}
function getBackendUrl() { return backendUrl; }

async function initAuth() {
  try {
    authToken = (await window.epicAI?.invoke('epic:session:token')) ?? null;
  } catch { authToken = null; }
  return authToken;
}
function getAuthToken() { return authToken; }

class ApiError extends Error {
  constructor(status, code, message) {
    super(message || `HTTP ${status}`);
    this.status = status;
    this.code = code;
  }
}

async function request(method, path, body, opts = {}) {
  const headers = { 'X-Epic-Client': 'desktop',...(opts.headers || {}) };
  if (authToken) headers.Authorization = `Bearer ${authToken}`;
  if (body !== undefined) headers['Content-Type'] = 'application/json';

  let res;
  try {
    res = await fetch(`${backendUrl}${path}`, {
      method,
      headers,
      credentials: 'include',
      body: body === undefined ? undefined : JSON.stringify(body),
      signal: AbortSignal.timeout(opts.timeout ?? 60_000),
    });
  } catch (e) {
    throw new ApiError(0, 'network_error', `Backend недоступен: ${e.message}`);
  }

  // Сессия могла появиться/обновиться уже после старта окна (вход в другом
  // окне) — один раз перечитываем токен и повторяем запрос.
  if (res.status === 401 && !opts._retried) {
    const token = await initAuth();
    if (token) return request(method, path, body, {...opts, _retried: true });
  }

  const text = await res.text();
  let json = null;
  if (text) { try { json = JSON.parse(text); } catch { json = { raw: text.slice(0, 500) }; } }

  if (!res.ok) {
    throw new ApiError(res.status, json?.error ?? 'error', json?.message ?? `HTTP ${res.status}`);
  }
  return json;
}

const api = {
  get: (p, o) => request('GET', p, undefined, o),
  post: (p, b, o) => request('POST', p, b ?? {}, o),
  put: (p, b, o) => request('PUT', p, b ?? {}, o),
  patch: (p, b, o) => request('PATCH', p, b ?? {}, o),
  del: (p, o) => request('DELETE', p, undefined, o),
};

const Ai = {
  ask: (mode, question) => api.post('/api/ai/ask', { mode, question }, { timeout: 90_000 }),
  search: (mode, q) => api.get(`/api/ai/search?mode=${encodeURIComponent(mode)}&q=${encodeURIComponent(q)}`),
  sources: (requestId) => api.get(`/api/ai/sources?requestId=${requestId}`),
  history: (limit = 20) => api.get(`/api/ai/history?limit=${limit}`),
  request: (id) => api.get(`/api/ai/request/${id}`),
  meta: () => api.get('/api/ai/meta'),
  /**
   * Голосовой ввод: сырая аудиозапись (Blob audio/webm) → текст.
   * Распознаёт backend (Groq Whisper); ключ API в клиент не передаётся.
   */
  transcribe: async (blob) => {
    const headers = { 'X-Epic-Client': 'desktop' };
    // П.2 раунда 34: ArrayBuffer-тело (раунд 28) не несёт неявного
    // Content-Type, а Fastify без него отвечает 415 Unsupported Media Type —
    // тип аудио ставим явно.
    headers['Content-Type'] = blob.type || 'audio/webm';
    if (authToken) headers.Authorization = `Bearer ${authToken}`;
    let res;
    try {
      res = await fetch(`${backendUrl}/api/ai/transcribe`, {
        method: 'POST', headers,
        // ArrayBuffer вместо Blob: известный Content-Length убирает chunked
        // data-pipe upload, из-за которого Chromium логил
        // «chunked_data_pipe_upload_data_stream.cc OnSizeReceived failed» (п.1 раунда 28).
        body: await blob.arrayBuffer(),
        credentials: 'include',
        signal: AbortSignal.timeout(90_000),
      });
    } catch (e) {
      throw new ApiError(0, 'network_error', `Backend недоступен: ${e.message}`);
    }
    const text = await res.text();
    let json = null;
    if (text) { try { json = JSON.parse(text); } catch { json = { raw: text.slice(0, 300) }; } }
    if (!res.ok) throw new ApiError(res.status, json?.error ?? 'error', json?.message ?? `HTTP ${res.status}`);
    return json;
  },
  /** Дневной лимит запросов: { used, limit, left, resetAt, personal }. */
  quota: () => api.get('/api/ai/quota'),
  feedbackCategories: () => api.get('/api/ai/feedback/categories'),

/** «вход через Telegram» / «вход через Discord» — по привязанным identity. */

/** Карточка «Ответы ИИ сегодня»: крупный остаток + прогресс-бар + подпись. */
function quotaCard() {

  const bar = el('span', { style: { width: '100%' } });

  void Ai.quota().then((q) => {
    const left = Number(q?.left ?? 0);

      el('b', {}, `${left} из ${limit}`),
      el('span', {}, 'осталось'),

    bar.style.width = limit > 0 ? `${Math.round((left / limit) * 100)}%` : '0%';

    caption.textContent = `Новые ответы появятся в ${reset} — лимит сбрасывается ежедневно${q?.personal ? ' (персональный лимит выдан администратором)' : ''}.`;
  }).catch(() => {
    big.textContent = '';
    big.appendChild(el('b', {}, '—'));
    caption.textContent = 'Лимит недоступен: backend не отвечает.';
    bar.style.width = '0%';

function applyVisualSettings(s) {
  const root = document.documentElement;
  const op = clamp(s.opacity ?? 0.82, 0.35, 1);
  root.style.setProperty('--panel-alpha', op.toFixed(3));
  root.style.setProperty('--surface-alpha', clamp(Math.min(1, op + 0.02), 0.3, 1).toFixed(3));
  root.style.setProperty('--muted-alpha', clamp(op - 0.05, 0.25, 1).toFixed(3));
  root.style.setProperty('--base-alpha', clamp(Math.min(1, op + 0.08), 0.3, 1).toFixed(3));
  root.style.setProperty('--drop-alpha', clamp(Math.min(1, op + 0.14), 0.3, 1).toFixed(3));
  root.dataset.lowperf = s.lowPerformanceMode ? 'true' : 'false';
  // Режим стримера: аватары размываются CSS-ом, ники подменяются в main.js
  root.dataset.streamer = s.streamerMode ? 'true' : 'false';
}

 *  — вкладка «Интерфейс» УБРАНА: прозрачность переехала в «Основное»;
 *  — вкладка «Профиль» ВЕРНУТА в настройки (п.4, п.5): отдельное окно профиля
 *    удалено, пилюля пользователя открывает настройки сразу на ней.
 */
const SECTIONS = [
  { id: 'main', label: 'Основное', icon: I.main },
  { id: 'rules', label: 'Правила', icon: I.rules },
  { id: 'keys', label: 'Клавиши', icon: I.keys },

/**
 * Скрытые разделы: «Профиль» НЕ показывается в навигации настроек
 * (п.2 раунда 19) — в него попадает только клик по пилюле пользователя
 * (п.3), внутри есть кнопка возврата к настройкам.
 */
const HIDDEN_SECTIONS = ['profile'];

function isKnownSection(id) {
  return Boolean(id) && (SECTIONS.some((s) => s.id === id) || HIDDEN_SECTIONS.includes(id));
}

/* ------------------------------------------------------------------ */
/*  Контекст                                                            */
/* ------------------------------------------------------------------ */

let ctx = null;
let activeSection = null;

function initSettings(context) { ctx = context; }

function renderSettings(container, section) {
  if (!ctx) return;
  activeSection = isKnownSection(section) ? section : 'main';

  const side = container.querySelector('#settings-side');
  const pages = container.querySelector('#settings-pages');
  if (!side || !pages) return;

  /* --- сайдбар: карточка пользователя, навигация, версия --- */
  clear(side);
  const u = ctx.user ?? {};
  side.append(
    el('div', { class: 'side-user' }, [
      // Режим стримера: настоящее фото, сильно размытое (п.2)
      ctx.settings?.streamerMode
        ? streamerAvatarNode('side-user__ava', u.avatarUrl, u.displayName || u.username)
        : avatarNode(u.avatarUrl, u.displayName || u.username, 'side-user__ava'),
      el('div', { style: { minWidth: '0' } }, [
        el('div', { class: 'side-user__name' }, ctx.settings?.streamerMode ? (ctx.settings.streamerNick || u.displayName || '—') : (u.displayName || u.username || '—')),
        el('div', { class: 'side-user__nick' }, ctx.settings?.streamerMode ? '@••••••' : `@${u.username ?? '—'}`),
      ]),
    ]),
    el('nav', { class: 'set-nav' }, SECTIONS.map((s) => el('button', {
      class: `settings__nav-item${s.id === activeSection ? ' is-active' : ''}`,
      type: 'button',
      onClick: () => ctx.onNavigate?.(s.id),
    }, [el('span', { html: s.icon, style: { display: 'inline-flex', width: '15px', height: '15px' } }), s.label]))),
    el('div', { class: 'side-foot' }, [
      el('span', { class: 'dot', id: 'side-status-dot' }),
      el('span', { id: 'side-version' }, `v${ctx.appVersion ?? '1.0.0'}`),
      el('span', { class: 'grow' }),
      el('span', { id: 'side-kb' }, 'база: …'),
    ]),
  );
  void refreshSideStatus();

  /* --- страница --- */
  // П.8: клик по элементу ВНУТРИ раздела не должен отматывать список наверх.
  // Скролл сбрасывается только при СМЕНЕ раздела, а перерисовка того же
  // раздела (переключатель, сохранение настройки) сохраняет позицию.
  const sameSection = pages.dataset.section === activeSection;
  const keepScroll = sameSection ? pages.scrollTop : 0;
  clear(pages);
  pages.appendChild(buildSection(activeSection));
  pages.dataset.section = activeSection;
  pages.scrollTop = keepScroll;
  ctx.onResize?.(measureHeight(activeSection));
}

async function refreshSideStatus() {
  const dot = document.getElementById('side-status-dot');
  const kb = document.getElementById('side-kb');
  if (!dot || !kb) return;
  try {
    const st = await Kb.status();
    kb.textContent = `база: ${st.documents.active} док. · ${st.stateLabel.toLowerCase()}`;
    dot.className = `dot${st.state === 'error' ? ' err' : ''}`;
    dot.style.background = st.stateColor;
    dot.style.boxShadow = `0 0 8px ${st.stateColor}`;
  } catch {
    kb.textContent = 'база недоступна';
    dot.className = 'dot err';
  }
}

/* ------------------------------------------------------------------ */

function page(title, sub,...nodes) {
  return el('div', {}, [
    el('div', { class: 'set-title' }, title),
    sub ? el('div', { class: 'set-sub' }, sub) : el('div', { style: { height: '12px' } }),
   ...nodes,
  ]);
}

function card(...rows) {
  return el('div', { class: 'opt-card' }, rows.filter(Boolean));
}

function row(name, desc, control) {
  return el('div', { class: 'opt-row' }, [
    el('div', { class: 'opt-row__label' }, [
      el('div', { class: 'opt-row__name' }, name),
      desc ? el('div', { class: 'opt-row__desc' }, desc) : null,
    ]),
    el('div', { class: 'opt-row__control' }, [].concat(control)),
  ]);
}

function toggle(key, current, onChange) {
  const input = el('input', { type: 'checkbox' });
  input.checked = Boolean(current);
  input.addEventListener('change', () => onChange(key, input.checked));
  return el('label', { class: 'switch' }, [input, el('span', { class: 'track' }), el('span', { class: 'thumb' })]);
}

function select(key, current, options, onChange) {
  const sel = el('select', { class: 'sel' }, options.map((o) => el('option', { value: o.value,...(String(o.value) === String(current) ? { selected: true } : {}) }, o.label)));
  sel.value = String(current);
  sel.addEventListener('change', () => onChange(key, sel.value));
  return sel;
}

function range(key, current, { min, max, step, format }, onChange) {
  const value = el('span', { class: 'range-value' }, format(current));
  const input = el('input', { class: 'range', type: 'range', min: String(min), max: String(max), step: String(step) });
  input.value = String(current);
  input.addEventListener('input', () => { value.textContent = format(Number(input.value)); });
  input.addEventListener('change', () => onChange(key, Number(input.value)));
  return [input, value];
}

/** Кейкапы: 'Ctrl+Shift+P' → [Ctrl][Shift][P]. */
function kbdRow(combo, { editable = false, onEdit } = {}) {
  const parts = String(combo ?? '').split('+').filter(Boolean);
  const wrap = el('span', { class: `kbd-row${editable ? ' is-editable' : ''}` }, parts.map((p) => el('span', { class: p.length > 2 ? 'kbd kbd--wide' : 'kbd' }, p)));
  if (editable && onEdit) wrap.addEventListener('click', () => onEdit(wrap));
  return wrap;
}

function buildSection(id) {
  const s = ctx.settings;
  switch (id) {
    case 'profile': return buildProfileSection(ctx);
    case 'main': return pageMain(s);
    case 'perf': return pagePerf(s);
    case 'rules': return pageRules();
    case 'keys': return pageKeys(s);
    case 'faq': return pageFaq();
    default: return pageMain(s);
  }
}

/**
 * Селект устройства микрофона (п.13): список audioinput из
 * navigator.mediaDevices.enumerateDevices(). Названия устройств браузер
 * отдаёт только после разрешения на микрофон — до этого показываем
 * «Микрофон N». Значение сохраняется в настройке micDeviceId.
 */
function micDeviceSelect(current, onChange) {
  const sel = el('select', { class: 'sel', style: { maxWidth: '190px' } });
  sel.appendChild(el('option', { value: '' }, 'По умолчанию'));
  sel.value = String(current ?? '');
  sel.addEventListener('change', () => onChange('micDeviceId', sel.value || null));
  const fill = async () => {
    try {
      if (!navigator.mediaDevices?.enumerateDevices) throw new Error('нет mediaDevices');
      const devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'audioinput');
      if (!devices.length) throw new Error('нет устройств');
      devices.forEach((d, i) => {
        sel.appendChild(el('option', { value: d.deviceId }, d.label || `Микрофон ${i + 1}`));
      });
      sel.value = String(current ?? '');
      if (sel.selectedIndex < 0) sel.value = '';
    } catch {
      // Нет доступа к списку устройств (или окружение без mediaDevices) —
      // оставляем только «По умолчанию».
      sel.title = 'Список устройств недоступен — используется устройство по умолчанию';
    }
  };
  void fill();
  return sel;
}

/** Перехват сочетания клавиш для горячей клавиши. */
function captureHotkey(wrap, fallback, onDone) {
  let listening = false;
  const caps = () => [...wrap.querySelectorAll('.kbd')];
  const onKey = (e) => {
    if (!listening) return;
    e.preventDefault(); e.stopPropagation();
    if (e.key === 'Escape') { stop(); return; }
    if (['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) return;
    const parts = [];
    if (e.ctrlKey || e.metaKey) parts.push('Ctrl');
    if (e.altKey) parts.push('Alt');
    if (e.shiftKey) parts.push('Shift');
    let key = e.key;
    if (key === ' ') key = 'Space';
    else if (key.length === 1) key = key.toUpperCase();
    parts.push(key);
    stop();
    void onDone(parts.join('+'));
  };
  const start = () => { listening = true; wrap.classList.add('is-listening'); clear(wrap); wrap.appendChild(el('span', { class: 'kbd kbd--wide' }, 'Нажмите сочетание…')); window.addEventListener('keydown', onKey, true); };
  const stop = () => { listening = false; wrap.classList.remove('is-listening'); window.removeEventListener('keydown', onKey, true); clear(wrap); String(fallback).split('+').forEach((p) => wrap.appendChild(el('span', { class: p.length > 2 ? 'kbd kbd--wide' : 'kbd' }, p))); };
  start();
}

/** Локальная дата YYYY-MM-DD — ключ дня для списка изменений базы. */
function todayKey() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function rulesChip(label, n) {
  return el('span', { class: 'role-pill', style: { color: 'var(--text-muted)' } }, [
    el('span', { class: 'dot' }), `${label} ${n}`,
  ]);
}

async function loadRulesPage(host) {
  let st;
  try { st = await Kb.status(); }
  catch (e) { clear(host); host.appendChild(el('div', { class: 'notice' }, [el('div', {}, [el('b', {}, 'База недоступна. '), e.message])])); return; }

  const t = st.today ?? {};
  const chips = [];
  if (t.newCount) chips.push(rulesChip('новых', t.newCount));
  if (t.updatedCount) chips.push(rulesChip('изменены', t.updatedCount));
  if (t.archivedCount) chips.push(rulesChip('в архиве', t.archivedCount));

  clear(host);
  host.append(
    // Карточка-статус: база обновлена сегодня
    el('div', { class: 'opt-card rules-status' }, [
      el('div', { class: 'rules-status__title' }, 'Обновлены сегодня'),
      el('div', { class: 'rules-status__meta' }, `база v${st.kbVersion} · синхронизация ${st.lastSyncLabel}`),
    ]),
    el('div', { class: 'rules-caption' }, 'Последние изменения'),
    // Карточка изменений: чипы «изменены N» + кнопка «Посмотреть»
    el('div', { class: 'opt-card' }, [
      el('div', { class: 'rules-changes__head' }, [
        el('div', { class: 'rules-changes__title' }, 'Обновление сегодня'),
        el('button', { class: 'btn', type: 'button', onClick: () => ctx.onOpenKb?.('updates', todayKey()) }, 'Посмотреть'),
      ]),
      el('div', { class: 'rules-chips' }, chips.length ? chips : [
        el('span', { class: 'subtle', style: { fontSize: '11px' } }, 'Сегодня изменений нет'),
      ]),
    ]),
    // Кнопка «История изменений» из вкладки «Правила» УБРАНА (требование
    // пользователя): история изменений доступна в самой области базы знаний
    // (переключатель «Посмотреть / История изменений» при открытии БЗ).
    st.lastError ? el('div', { class: 'notice' }, [el('div', {}, [el('b', {}, 'Ошибка синхронизации: '), st.lastError])]) : null,
    el('div', { class: 'kb-note' }, 'База обновляется автоматически при запуске приложения и по расписанию — кнопка ручного обновления не нужна.'),
  );
}

        a: 'Так Windows поступает с полноэкранными играми: любое окно поверх сворачивает игру. Переключите игру в оконный режим без рамки — выглядит так же, как полный экран.',
        crumbs: ['В игре', 'Настройки', 'Графика', 'Тип экрана', 'Оконный без рамки'],
      },
      { q: 'Пропадает звук игры, пока открыто окно', a: 'Часть игр глушит звук при потере фокуса. Включите в настройках игры фоновый звук («Audio → Mute when unfocused» или похожее) либо играйте в оконном режиме без рамки.' },
      { q: 'Окно не открывается по горячей клавише', a: 'Откройте «Клавиши» и кликните по кейкапам первой строки, чтобы назначить новое сочетание: старое могло быть перехвачено оверлеем драйвера мыши, Discord или другой программой.' },
      { q: 'Окно прячется, когда кликаю по игре', a: 'Так работает автоскрытие: клик вне Epic AI прячет оверлей, а приложение продолжает работать в трее. Закреплённое звёздочкой окно НЕ прячется — открепите его или выключите «Основное» → «Скрывать при клике вне окна».' },
      { q: 'Как закрепить окно поверх игры', a: 'Кнопка-звёздочка в баре, тумблер «Поверх всех окон» в разделе «Основное» или сочетание Ctrl+P (работает глобально, даже в игре). Оверлей использует уровень screen-saver, поэтому виден и поверх оконной игры; пока окно закреплено, клик по игре его не прячет.' },
    ],
  },
  {
    cat: 'База знаний и ответы',
    items: [
      { q: 'Пишет «не найдено подтверждённой информации»', a: 'Это не сбой, а принцип Epic AI: ответы даются только по официальной базе. Проверьте, что выбран верный режим (Правила / Законы), и при необходимости обновите базу в разделе «Правила».' },
      { q: 'Как обновить базу правил', a: 'Ничего нажимать не нужно: база обновляется сама при запуске приложения и по расписанию. Посмотреть новые и изменённые документы можно в «Правила» → «Посмотреть»: слева список изменений за день, справа сравнение «было / стало» с цветным diff; старые редакции не удаляются.' },
      { q: 'Ответ ссылается на устаревшую редакцию', a: 'Поставьте 👎 и выберите «Устаревшая информация»: создастся отчёт, администратор сверит версию документа с форумом и исправит базу или промпт.' },
      { q: 'Чем «Правила» отличаются от «Законов»', a: 'Это две независимые базы: правила проекта, сервера и организаций — против Конституции, Penal Code и судебных документов. Поиск в одном режиме не примешивает документы другого.' },
    ],
  },
  {
    cat: 'Программа',
    items: [
      { q: 'Аппаратное ускорение: включать или нет', a: 'На обычном ПК — включать: интерфейс рендерится GPU через Vulkan (ANGLE), это быстрее обычного рендера. На слабом ноутбуке или при просадках FPS отключите его либо включите «Режим снижения нагрузки» в разделе «Производительность». Живой фон со съёмкой экрана убран полностью, поэтому оверлей больше не нагружает игру.' },
      { q: 'Куда девается окно при закрытии крестиком', a: 'В системный трей: приложение продолжает работать и синхронизировать базу. Полный выход — иконка трея → «Выход».' },
      { q: 'Где хранятся мои настройки и сессия', a: 'Настройки привязаны к аккаунту Epic AI и общие между машинами. Сессия хранится в защищённом хранилище Electron на этом компьютере и не передаётся наружу.' },
    ],
  },
];

function pageFaq() {
  const wrap = page('Частые вопросы', 'Короткие ответы на то, что спрашивают чаще всего.');
  for (const group of FAQ) {
    wrap.appendChild(el('div', { class: 'faq-cat' }, group.cat));
    for (const item of group.items) {
      const body = el('div', { class: 'faq-item__body' }, [el('div', {}, item.a)]);
      if (item.crumbs?.length) {
        body.appendChild(el('div', { class: 'crumbs' }, item.crumbs.flatMap((c, i) => [
          i > 0 ? el('span', { class: 'crumb-sep' }, '›') : null,
          el('span', { class: i === 0 ? 'crumb crumb--muted' : 'crumb' }, c),
        ]).filter(Boolean)));
      }
      const head = el('button', { class: 'faq-item__head', type: 'button' }, [
        el('span', {}, item.q),
        el('span', { class: 'faq-item__chev', html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>' }),
      ]);
      const box = el('div', { class: 'faq-item' }, [head, body]);
      head.addEventListener('click', () => box.classList.toggle('is-open'));
      wrap.appendChild(box);
    }
  }
  return wrap;
}

/* ---------- Профиль ----------
   Вкладка «Профиль» из настроек УБРАНА (требование пользователя): профиль
   и аккаунт открываются ОТДЕЛЬНЫМ окном (renderer/profile.html) — клик по
   шапке меню пользователя или пункт «Профиль и аккаунт». В окне профиля:
   аватар, роль, «@ник · вход через Telegram», карточка «Ответы ИИ сегодня»
   с остатком дневного лимита и прогресс-баром, «Выйти из аккаунта». */




/* ==== sources.js ==== */
(function () {
'use strict';
/**
 * EPIC AI — окно источников.
 *
 * Отдельный BrowserWindow справа от основной панели. Показывает:
 * найденные статьи, пункты, подпункты, название документа, категорию,
 * дату редакции и ссылку на оригинал («Открыть источник ↗»).
 *
 * Все эти данные приходят с backend'а из базы источников — AI их не формирует.
 */

let payload = null;

async function boot() {
  // Токен сессии — до первых запросов к API (file:// не отправляет cookie)
  await initAuth();
  const runtime = await window.epicAI?.invoke('epic:runtime').catch(() => null);
  if (runtime?.backendUrl) setBackendUrl(runtime.backendUrl);
  if (runtime?.settings) applyVisualSettings(runtime.settings);

  window.epicAI?.on('settings:changed', applyVisualSettings);
  window.epicAI?.on('sources:data', (data) => { payload = data; render(data); });

  $('#src-close').addEventListener('click', () => window.epicAI?.invoke('epic:sources:close').catch(() => window.close()));
  $('#src-refresh').addEventListener('click', async () => {
    if (!payload?.requestId) return;
    try {
      const fresh = await Ai.sources(payload.requestId);
      payload = {...payload, sources: fresh.sources ?? payload.sources };
      render(payload);
    } catch (e) { /* offline */ }
  });

  // Данные могут прийти до подписки — запросим сами
  const q = new URLSearchParams(location.search);
  const requestId = q.get('requestId');
  if (!requestId && window.__DEMO_SOURCES_PAYLOAD__) {
    payload = window.__DEMO_SOURCES_PAYLOAD__;
    render(payload);
    return;
  }
  if (requestId) {
    try {
      const data = await Ai.sources(requestId);
      payload = {...data, modeLabel: data.mode === 'laws' ? 'ЗАКОНЫ' : 'ПРАВИЛА' };
      render(payload);
    } catch { /* ждём sources:data */ }
  }
}

function render(data) {
  const list = $('#src-list');
  clear(list);

  $('#src-mode').textContent = data.modeLabel ?? (data.mode === 'laws' ? 'ЗАКОНЫ' : 'ПРАВИЛА');
  $('#src-count').textContent = String(data.sources?.length ?? 0);
  clear($('#src-question'));
  $('#src-question').append(
    el('b', {}, 'Запрос: '),
    document.createTextNode(data.question ?? '—'),
  );
  $('#src-meta').textContent = [
    data.kbVersion ? `база v${data.kbVersion}` : null,
    data.generatedAt ? `сформировано ${fmtDateTime(data.generatedAt)}` : null,
  ].filter(Boolean).join(' · ');

  if (data.noData || !data.sources?.length) {
    list.appendChild(el('div', { class: 'src-nodata' }, [
      el('b', {}, 'В официальной базе EpicRP не найдено подтверждённой информации для однозначного ответа.'),
      el('div', { style: { marginTop: '6px' } }, 'Система не придумывает правила и статьи: если официального источника нет, ответа нет. Попробуйте переформулировать запрос или проверить другой режим (ПРАВИЛА / ЗАКОНЫ).'),
    ]));
  }

  const terms = collectTerms(data.question);
  for (const s of data.sources ?? []) list.appendChild(sourceCard(s, terms));

  if (data.relatedDocuments?.length) {
    list.appendChild(el('div', { class: 'src-related' }, [
      el('div', { class: 'src-related__title' }, 'Возможно, относится к запросу'),
     ...data.relatedDocuments.map((d) => el('div', { class: 'src-related__item' }, [
        el('span', { style: { color: 'var(--accent-mid)' } }, '•'),
        el('span', {}, d.title),
      ])),
    ]));
  }
}

function sourceCard(s, terms) {
  const kindLabel = s.docType === 'LAW' ? 'Закон' : 'Правило';
  const kindClass = s.docType === 'LAW' ? 'badge' : 'badge badge--mid';

  return el('article', { class: 'src-card' }, [
    el('div', { class: 'src-card__head' }, [
      el('span', { class: 'src-card__num' }, String(s.index + 1)),
      el('div', { class: 'src-card__titles' }, [
        el('div', { class: 'src-card__doc' }, s.title),
        s.heading ? el('div', { class: 'src-card__item' }, s.heading) : null,
      ]),
      el('span', { class: `${kindClass} src-card__kind` }, kindLabel),
    ]),

    el('div', { class: 'src-card__meta' }, [
      s.category ? el('span', {}, [el('b', {}, 'Категория: '), s.category]) : null,
      s.section ? el('span', { class: 'ellipsis', style: { maxWidth: '100%' } }, [el('b', {}, 'Раздел: '), s.section]) : null,
      el('span', {}, [el('b', {}, 'Дата редакции: '), el('span', { class: 'mono' }, s.revisionLabel || '—')]),
      el('span', {}, [el('b', {}, 'Версия: '), el('span', { class: 'mono' }, `v${s.version}`)]),
      el('span', {}, [el('b', {}, 'Тема: '), el('span', { class: 'mono' }, `#${s.threadId}`)]),
    ]),

    el('div', { class: 'src-card__text selectable' }, highlight(s.content, terms)),

    el('div', { class: 'src-card__foot' }, [
      el('a', {
        class: 'src-open', href: s.url, title: s.url,
        onClick: (e) => { e.preventDefault(); void openExternal(s.url); },
      }, [
        document.createTextNode('Открыть источник'),
        el('span', { html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>', style: { display: 'inline-flex', width: '11px', height: '11px' } }),
      ]),
      el('span', { class: 'grow' }),
      el('span', { class: 'subtle', style: { fontSize: '9.5px' } }, `forum.epic-gta.com`),
    ]),
  ]);
}

/** Слова запроса — для подсветки найденного. */
function collectTerms(question) {
  return [...new Set(
    String(question ?? '').toLowerCase().match(/[a-zа-яё0-9]{3,}/gi) ?? [],
  )].slice(0, 24);
}

let __booted = false;
function __start() {
  if (__booted) return;   // защита от повторного запуска (double DOMContentLoaded)
  __booted = true;
  void boot();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', __start);
else __start();

})();
</script>
