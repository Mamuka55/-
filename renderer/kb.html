<!DOCTYPE html>
<html lang="ru" data-blur="false" data-animations="true" data-lowperf="false">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src https: data: blob:; connect-src http://127.0.0.1:* http://localhost:* https:; font-src 'self' data:;" />
<title>База знаний — Epic AI</title>
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/base.css" />
<link rel="stylesheet" href="styles/main.css" />
<link rel="stylesheet" href="styles/kb.css" />
</head>
<body class="kbwin">
  <div class="kbwin__chrome">
    <span class="kbwin__logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9.5 12h6M9.5 16h6"/></svg>
    </span>
    <b class="kbwin__title">База знаний EpicRP</b>
    <span class="kbwin__tabs" role="tablist" aria-label="Разделы базы знаний">
      <button class="kbtab is-active" id="tab-updates" role="tab" aria-selected="true" type="button">Обновления</button>
      <button class="kbtab" id="tab-history" role="tab" aria-selected="false" type="button">История изменений</button>
    </span>
    <span class="grow"></span>
    <button class="icon-btn" id="kb-close" title="Закрыть" aria-label="Закрыть">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="kbwin__body" id="kb-root"></div>
  <script type="module" src="scripts/kb.js"></script>
</body>
</html>
